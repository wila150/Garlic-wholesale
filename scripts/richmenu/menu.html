<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:2500px;height:1686px;font-family:'Noto Sans TC',sans-serif;display:grid;grid-template-columns:1300px 1200px;grid-template-rows:843px 843px;gap:0;background:#16291F}
.c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;color:#fff;border:6px solid #16291F}
.big{grid-row:span 2;background:#F5D547;color:#2A2400}
.a{background:#2F6B45}.b{background:#23523A}
.ic{font-size:300px;line-height:1}
.big .ic{font-size:420px}
.t{font-size:150px;font-weight:900;letter-spacing:8px}
.big .t{font-size:200px}
.s{font-size:70px;font-weight:500;opacity:.85}
</style></head><body>
<div class="c big"><div class="ic">🧄</div><div class="t">我要叫貨</div><div class="s">點選品項，不用打字</div></div>
<div class="c a"><div class="ic" style="font-size:220px">📋</div><div class="t" style="font-size:130px">我的訂單</div></div>
<div class="c b"><div class="ic" style="font-size:220px">💬</div><div class="t" style="font-size:130px">聯絡老闆</div></div>
</body></html>
