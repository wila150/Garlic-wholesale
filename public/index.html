<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>/* 預設淺色；在後台按「深色」才切換，記在這台裝置 */try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='dark'?'dark':'light';document.documentElement.dataset.palette=localStorage.getItem('palette')||'garlic'}catch(e){document.documentElement.dataset.theme='light'}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>叫貨單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EA; --surface:#FFFFFF; --ink:#1B2A21; --muted:#5B6B60; --line:#D6E0D0;
  --leaf:#2F6B45; --leaf-soft:#DCEBDD; --tag:#F5D547; --alert:#B23A2E; --line-green:#06C755;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111915; --surface:#1A241E; --ink:#E4ECE5; --muted:#98A99E; --line:#2B3A31;
    --leaf:#78C093; --leaf-soft:#22362A; --alert:#E0776B;
  }
}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1A241E; --ink:#E4ECE5; --muted:#98A99E; --line:#2B3A31;
  --leaf:#78C093; --leaf-soft:#22362A; --alert:#E0776B;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.head{background:var(--line-green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.head b{font-size:1.15rem;display:block}
.head small{display:block;opacity:.95;font-size:.85rem}
.tools{padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tools input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:7px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 12px;font-size:.88rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips .ct{display:inline-block;margin-left:4px;background:var(--tag);color:#2A2400;border-radius:8px;padding:0 5px;font-size:.75rem;font-weight:700}
.list{flex:1;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
/* 電腦：左邊搜尋和分類，右邊品項排成好幾欄（手機維持上下排） */
@media (min-width:900px){
  .app{max-width:1280px}
  .main{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .main>.tools{grid-column:1;grid-row:1/3;border-bottom:0;border-right:1px solid var(--line);padding:14px 12px;overflow-y:auto}
  .main>.mode{grid-column:2;grid-row:1}
  .main>.list{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));align-content:start;gap:8px;padding:14px}
  .main>.list>.repeat,.main>.list>.noitem,.main>.list>.lcat{grid-column:1/-1}
  .chips{flex-direction:column;overflow:visible;gap:4px;padding:12px 0}
  .chips button{text-align:left;padding:9px 14px;border-radius:10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
  body.shop .main>.list>.prow{margin:0;border-radius:var(--r);border-bottom:0;box-shadow:0 0 0 1px var(--line)}
}
.repeat{margin:10px 12px;padding:10px 12px;border:1px dashed var(--leaf);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.repeat button{border:0;background:var(--leaf);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700;white-space:nowrap}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.prow.sel{background:var(--leaf-soft)}
.prow .pn{font-weight:700;font-size:1.05rem}
.prow .pn small{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:6px}
.prow .ph{display:block;margin-left:0;margin-top:2px}
.usel{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:700;padding:0 4px}
.prow .pks{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px}
.prow .pks small{margin-left:0;font-size:.75rem}
.prow .pk{border:1px solid var(--leaf);background:var(--surface);color:var(--leaf);border-radius:14px;padding:2px 9px;font-size:.82rem;font-weight:700;min-height:30px;white-space:nowrap}
.prow .pn em{font-style:normal;font-weight:400;color:var(--alert);font-size:.78rem;margin-left:6px}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:700;line-height:1;display:grid;place-items:center}
.stp button.plus{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stp input{width:56px;height:40px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-weight:900;font-size:1.1rem;padding:0}
.prow.sel .stp input{border-color:var(--leaf);background:var(--surface)}
.stp input::-webkit-inner-spin-button{display:none}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .u{color:var(--muted);font-size:.9rem}
.ctl select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 4px;font-weight:700;font-size:1rem}
.prow.jin .stp input{width:48px}
.noitem,.msg{padding:28px 16px;color:var(--muted);text-align:center}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.bar span{flex:1;font-size:.92rem}
.bar button{border:0;background:var(--line-green);color:#fff;border-radius:22px;padding:11px 20px;font-weight:700}
.bar button:disabled{background:var(--line);color:var(--muted)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet-in{background:var(--surface);width:100%;max-height:85%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in h3{margin:0;padding:14px 16px 6px;font-size:1.05rem}
.sl{overflow-y:auto;padding:0 16px}
.sl div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.sl .chg{color:var(--leaf);font-size:.8rem;margin-left:6px}
.err{color:var(--alert);font-weight:700;font-size:.9rem;padding:4px 16px 0}
.sa{display:flex;gap:8px;padding:12px 16px}
.sa button{flex:1;border-radius:22px;padding:11px;font-weight:700;border:1px solid var(--line);background:var(--bg)}
.sa .go{background:var(--line-green);border-color:var(--line-green);color:#fff}
.done{position:absolute;inset:0;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;z-index:6}
.done.on{display:flex}
.proxybar{background:#B7472A;color:#fff;font-weight:700;padding:6px 12px;font-size:.95rem;display:flex;align-items:center;gap:12px}
.proxybar button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:8px;padding:5px 12px;font-weight:700;min-height:34px}
.join{padding:18px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.join h2{margin:0;font-size:1.3rem}
.join p{margin:0;color:var(--muted);font-size:.95rem}
.join label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:1.05rem}
.join input{font-size:1.15rem;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.join button{border:0;background:var(--line-green);color:#fff;border-radius:24px;padding:14px;font-size:1.15rem;font-weight:700;margin-top:4px}
.join button:disabled{opacity:.6}
.join .err{color:var(--alert);font-weight:700;min-height:1.2em}
.done .ok{font-size:2.8rem;line-height:1}
.done p{margin:0;color:var(--muted);font-size:.92rem}
.done ul{list-style:none;margin:6px 0;padding:0;width:100%;max-width:320px;text-align:left}
.done li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.done button{border:1px solid var(--leaf);background:transparent;color:var(--leaf);border-radius:20px;padding:8px 16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;z-index:30}
.toast.show{opacity:1}
.mode{background:#FFF6D6;color:#4A3B00;padding:9px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.mode span{flex:1}
.mode small{display:block;opacity:.85}
.mode button{border:0;background:#E0A800;color:#241C00;border-radius:18px;padding:7px 14px;font-weight:700;white-space:nowrap}
.mode.on{background:var(--leaf);color:#fff}
.mode.on button{background:#fff;color:var(--leaf)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/brand.js"></script>
</head>
<body class="shop">
<div class="app">
  <div class="head"><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2.5c1.3 2.4 1.2 4.7.3 6.6C22 10.4 27.5 14.7 27.5 20.6c0 5.6-5.1 8.9-11.5 8.9S4.5 26.2 4.5 20.6c0-5.9 5.5-10.2 11.2-11.5-.9-1.9-1-4.2.3-6.6z" fill="currentColor"/><path d="M16 11.5c-2.6 2.9-3.6 6.1-3.6 9.3 0 3 1.1 5.5 3.6 7.4m0-16.7c2.6 2.9 3.6 6.1 3.6 9.3 0 3-1.1 5.5-3.6 7.4" stroke="#1F4D3A" stroke-opacity=".55" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></span><div class="ht"><b id="title">叫貨單</b><small id="subtitle">載入中…</small></div></div>
  <div class="msg" id="msg" hidden></div>
  <form class="join" id="join" hidden onsubmit="return false">
    <h2>第一次使用，請填店家資料</h2>
    <p>填好按「開通」，馬上就能在 LINE 叫貨。</p>
    <label>店家名稱<input id="jName" maxlength="30" autocomplete="organization" placeholder="例如：阿美麵店"></label>
    <label>地址<input id="jAddr" maxlength="80" autocomplete="street-address" placeholder="送貨地址"></label>
    <label>聯絡電話<input id="jPhone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="例如：0912345678"></label>
    <div class="err" id="jErr" role="alert"></div>
    <button id="jGo" type="submit">開通</button>
  </form>
  <div class="main">
  <div class="tools" id="tools" hidden>
    <input id="q" type="search" placeholder="找品項" aria-label="搜尋品項">
    <div class="chips" id="chips"></div>
  </div>
  <div class="mode" id="modeBar" hidden></div>
  <div class="list" id="plist" hidden></div>
  </div>
  <div class="bar" id="bar" hidden><span id="cartInfo"></span><button id="review" disabled>送出訂單</button></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in"><h3 id="sheetTitle">確認這次叫的貨</h3><div class="sl" id="sheetList"></div><div class="err" id="err" role="alert"></div><div class="sa"><button id="back">返回修改</button><button class="go" id="submit">確認送出</button></div></div></div>
  <div class="done" id="done" role="status"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtQ=q=>Number.isInteger(q)?q:(+q.toFixed(2));
// 和 lib/qty.js 的 qtyText 一樣：斤用「幾斤幾兩」（1 斤 = 16 兩）
function qtyText(q,unit){q=Number(q)||0;if(unit==='斤'&&!Number.isInteger(q)){let j=Math.floor(q),l=Math.round((q-j)*16);if(l===16){j++;l=0}if(Math.abs(j+l/16-q)<0.001)return `${j?j+'斤':''}${l?l+'兩':''}`||'0斤'}return `${Number.isInteger(q)?q:+q.toFixed(2)} ${unit}`}
const jinOf=q=>Math.floor(q+1e-9),liangOf=q=>Math.round((q-jinOf(q))*16)%16;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
// 從 LIFF（liff.line.me/…?t=…）打開時，參數先包在 liff.state 裡
const Q=(()=>{const q=new URLSearchParams(location.search),st=q.get('liff.state');return st?new URLSearchParams(st.replace(/^[^?]*\?/,'')):q})();
const T=Q.get('t')||'',DRAFT=Q.get('d')||'';
// order：叫配送日的貨；addon：截單後補單（另開一張，跟原本的訂單分開）
let MODE='order';
let D=null,cart={},cat='常叫',liffReady=false;
const PM=()=>Object.fromEntries(D.products.map(p=>[p.id,p]));

// 老闆在後台選的配色
function applyPalette(p){if(!p)return;document.documentElement.dataset.palette=p;try{localStorage.setItem('palette',p)}catch{}}
async function load(){
  let r;
  try{r=await fetch('/api/shop?t='+encodeURIComponent(T)+(DRAFT?'&d='+encodeURIComponent(DRAFT):''));D=await r.json()}catch{D={error:'載入失敗，請重新整理'}}
  applyPalette(D.palette);
  applyBrand({logo:D.logo});if(D.search)$('q').placeholder=D.search;
  if(D.shopName){$('title').textContent=D.shopName}
  if(!r?.ok){$('subtitle').textContent='';$('msg').hidden=false;$('msg').textContent=D.error;return}
  // 後台代客叫貨（電話叫貨）：上面標清楚是幫哪家店叫
  if(Q.get('proxy')&&D.store){const n=document.createElement('div');n.className='proxybar';n.innerHTML=`<button type="button" data-back="1">← 回後台</button><span>📞 代客叫貨：${esc(D.store.name)}</span>`;document.querySelector('.app').prepend(n)}
  if(D.join){$('subtitle').textContent='新店家開通';$('join').hidden=false;if(D.liffId)initLiff();return}
  D.main={date:D.date,dateLabel:D.dateLabel,cutoff:D.cutoff,order:D.order};
  ['tools','plist','bar'].forEach(id=>$(id).hidden=false);
  // 訂單裡有、但已經下架的品項，也要顯示出來
  [...(D.order?.items||[]),...(D.addon?.order?.items||[])].forEach(i=>{if(!PM()[i.pid])D.products.push({id:i.pid,name:i.name,unit:i.unit,cat:'',on:false})});
  // 原本的單已經被老闆確認（鎖住）：直接進補單
  // 進補單：網址指定、原本的單已確認、或 AI 整理的單那天已經截單（只能補單）
  const draftToAddon=D.draft&&D.addon&&D.draft.date!==D.main.date&&D.addon.date===D.draft.date;
  setMode((Q.get('m')==='addon'||D.addon?.mainLocked||draftToAddon)&&D.addon?'addon':'order');
  // 從 LINE「用叫貨單修改」進來：把 AI 整理的品項加進去
  if(D.draft&&D.draft.addonDate&&MODE==='order')toast(`已帶入 AI 整理的品項。要補 ${D.addon?.dateLabel||''} 的貨，請按上面「補單」`);
  else if(D.draft)toast(D.draft.unknown.length?`已帶入 AI 整理的品項。看不懂的：${D.draft.unknown.join('、')}`:'已帶入 AI 整理的品項，確認後按送出');
  if(D.liffId)initLiff();
}
function setMode(m){
  MODE=m;
  const A=D.addon,src=m==='addon'?{date:A.date,dateLabel:A.dateLabel,cutoff:A.until,order:A.order}:D.main;
  Object.assign(D,{date:src.date,dateLabel:src.dateLabel,cutoff:src.cutoff,order:src.order});
  cart={};(D.order?.items||[]).forEach(i=>cart[i.pid]=i.qty);
  if(D.draft)for(const i of D.draft.items){const op=i.op||'add';if(op==='remove')delete cart[i.pid];else if(op==='set')cart[i.pid]=i.qty;else cart[i.pid]=Math.round(((cart[i.pid]||0)+i.qty)*10000)/10000}
  document.title=D.store.name+(m==='addon'?' 補單':' 叫貨單');
  $('title').textContent=D.store.name+(m==='addon'?'・補單':'・叫貨單');
  $('subtitle').textContent=m==='addon'?`${D.dateLabel} 配送，${D.cutoff} 前可以補`:`${D.dateLabel} 配送，${D.cutoff} 前可以改`;
  const bar=$('modeBar');bar.hidden=!A;bar.classList.toggle('on',m==='addon');
  if(A&&m==='order')bar.innerHTML=`<span>${esc(A.dateLabel)} 的貨${A.mainLocked?'老闆已經確認':'已截單'}，要加點？<small>${esc(A.until)} 前可以補單，會另開一張</small></span><button data-mode="addon">補單</button>`;
  if(A&&m==='addon'){
    const n=A.others.reduce((a,o)=>a+o.items.length,0);
    bar.innerHTML=`<span>這是另外一張補單${n?`<small>原本的訂單 ${n} 樣${A.mainLocked?'老闆已經確認，':''}不會變</small>`:''}</span>${A.mainLocked?'':`<button data-mode="order">回到叫 ${esc(D.main.dateLabel)}</button>`}`;
  }
  cat=m==='addon'||D.draft?'全部':frequent().size?'常叫':'全部';
  $('q').value='';render();$('plist').scrollTop=0;
}
// 新店家自己開通：填店名、地址、電話
async function join(){
  const v={name:$('jName').value.trim(),address:$('jAddr').value.trim(),phone:$('jPhone').value.trim()};
  const miss=!v.name?['jName','請填店家名稱']:!v.address?['jAddr','請填地址']:!v.phone?['jPhone','請填聯絡電話']:null;
  if(miss){$('jErr').textContent=miss[1];$(miss[0]).focus();return}
  $('jGo').disabled=true;$('jErr').textContent='';
  try{
    const r=await fetch('/api/shop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,action:'join',...v})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'開通失敗，請再試一次');
    // 在 LINE 裡開的：用店家的身分傳「開通完成」（和剛剛先傳的叫貨內容）回聊天室，就會回說明和整理好的叫貨單
    if(liffReady){try{await liff.sendMessages([{type:'text',text:'開通完成'},...(j.order?[{type:'text',text:j.order}]:[])]);liff.closeWindow();return}catch{}}
    $('join').hidden=true;
    $('done').innerHTML=`<div class="ok">✅</div><b>「${esc(j.store.name)}」開通好了！</b><p>回到 LINE 直接打字叫貨就可以，例如：<br>${esc(j.example)}</p>${j.order?'<p>剛剛傳的叫貨內容，請再傳一次。</p>':''}`;
    $('done').classList.add('on');
  }catch(e){$('jErr').textContent=e.message;$('jGo').disabled=false}
}
$('join').addEventListener('submit',join);
function initLiff(){
  const s=document.createElement('script');s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.onload=()=>liff.init({liffId:D.liffId}).then(()=>{liffReady=liff.isInClient()}).catch(()=>{});
  document.head.appendChild(s);
}
const frequent=()=>new Set([...(D.last?.items||[]).map(i=>i.pid),...(D.order?.items||[]).map(i=>i.pid)]);
const had=()=>!!D.order;

function render(){renderChips();renderList();renderBar()}
function renderChips(){
  const cnt={};const pm=PM();Object.keys(cart).forEach(pid=>{if(cart[pid]>0&&pm[pid]){const c=pm[pid].cat;cnt[c]=(cnt[c]||0)+1}});
  const list=['常叫','全部',...D.categories];
  $('chips').innerHTML=list.map(c=>`<button data-cat="${esc(c)}" aria-pressed="${c===cat}">${c==='常叫'?'常用':esc(c)}${cnt[c]?`<span class="ct">${cnt[c]}</span>`:''}</button>`).join('');
}
function visible(){
  const q=$('q').value.trim();
  const items=D.products.filter(p=>p.on||cart[p.id]>0);
  if(q)return items.filter(p=>p.name.includes(q));
  if(cat==='常叫'){const f=frequent();Object.keys(cart).forEach(k=>cart[k]>0&&f.add(k));return items.filter(p=>f.has(p.id))}
  if(cat==='全部')return items;
  return items.filter(p=>p.cat===cat);
}
// 單位：有包裝換算的品項，店家可以選用哪個單位叫（例如 包／件）；存的一律是品項本來的單位
const UNIT={};
const packsOf=p=>(p.packs||[]).filter(k=>k.n>0);
// 「斤」的品項預設可以叫到兩；後台關掉（liang:false）就只能叫整數斤
const useLiang=p=>p.unit==='斤'&&D.liang!==false&&p.liang!==false;
function rowHTML(p){
  const q=cart[p.id]||0,ks=packsOf(p),k=ks.find(x=>x.unit===UNIT[p.id]);
  const f=k?k.n:1,u=k?k.unit:p.unit,jin=!k&&useLiang(p);
  const usel=ks.length?`<select class="usel" data-unit="${p.id}" aria-label="${esc(p.name)}單位">${[p.unit,...ks.map(x=>x.unit)].map(x=>`<option ${x===u?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<span class="u">${esc(u)}</span>`;
  const stp=`<div class="stp"><button data-dq="-1" data-f="${f}" data-pid="${p.id}" aria-label="${esc(p.name)}減 1${esc(u)}">−</button>
  ${jin?`<input type="number" inputmode="numeric" min="0" step="1" value="${jinOf(q)||''}" placeholder="0" data-jin="${p.id}" aria-label="${esc(p.name)}幾斤">`
    :`<input type="number" inputmode="decimal" min="0" step="any" value="${q?fmtQ(Math.round(q/f*10000)/10000):''}" placeholder="0" data-qin="${p.id}" data-f="${f}" aria-label="${esc(p.name)}數量（${esc(u)}）">`}
  <button class="plus" data-dq="1" data-f="${f}" data-pid="${p.id}" aria-label="${esc(p.name)}加 1${esc(u)}" ${p.on?'':'disabled'}>+</button></div>`;
  const ctl=`<div class="ctl">${stp}${usel}${jin?`<select data-liang="${p.id}" aria-label="${esc(p.name)}幾兩">${Array.from({length:16},(_,i)=>`<option value="${i}" ${i===liangOf(q)?'selected':''}>${i}</option>`).join('')}</select><span class="u">兩</span>`:''}</div>`;
  // 換算說明；選了包裝單位就寫換成多少
  const hint=k?(q?`＝${esc(qtyText(q,p.unit))}`:`1${esc(k.unit)}＝${k.n}${esc(p.unit)}`):ks.map(x=>`1${esc(x.unit)}＝${x.n}${esc(p.unit)}`).join('・');
  return `<div class="prow ${q>0?'sel':''} ${jin?'jin':''}" id="r-${p.id}"><div class="pn">${esc(p.name)}${p.on?'':'<em>暫停供貨</em>'}${hint?`<small class="ph">${hint}</small>`:''}</div>${ctl}</div>`;
}
function renderList(){
  const items=visible(),q=$('q').value.trim();
  let h='';
  if(MODE==='order'&&cat==='常叫'&&!q&&D.last&&!Object.values(cart).some(v=>v>0))
    h+=`<div class="repeat"><span>上次叫了 ${D.last.items.length} 樣</span><button data-repeat="1">照上次叫</button></div>`;
  h+=items.length?items.map(rowHTML).join(''):`<div class="noitem">${q?'找不到這個品項，可以在 LINE 留言告訴老闆':'還沒有常用的品項，點「全部」或分類開始選'}</div>`;
  $('plist').innerHTML=h;
}
function renderBar(){
  const n=Object.values(cart).filter(v=>v>0).length;
  const w=MODE==='addon'?'補單':'訂單';
  $('cartInfo').textContent=n?`已選 ${n} 樣`:(had()?`全部清空會取消這張${w}`:'還沒選任何品項');
  $('review').disabled=!n&&!had();
  $('review').textContent=had()?`更新${w}`:`送出${w}`;
}
function setQty(pid,q){
  q=Math.max(0,Math.min(999,Math.round(q*10000)/10000));
  if(q>0)cart[pid]=q;else delete cart[pid];
  const r=$('r-'+pid);
  if(r){
    // 正在打字的框不要動，其他（兩、換算說明）整列重畫
    const inp=r.querySelector('input');
    if(document.activeElement===inp){r.classList.toggle('sel',q>0);const ph=r.querySelector('.ph'),p=PM()[pid],k=packsOf(p).find(x=>x.unit===UNIT[pid]);if(ph&&k)ph.textContent=q?`＝${qtyText(q,p.unit)}`:`1${k.unit}＝${k.n}${p.unit}`;const ls=r.querySelector('[data-liang]');if(ls)ls.value=liangOf(q)}
    else r.outerHTML=rowHTML(PM()[pid]);
  }
  renderChips();renderBar();
}
function openSheet(){
  const pm=PM(),old=Object.fromEntries((D.order?.items||[]).map(i=>[i.pid,i.qty]));
  const ids=[...new Set([...Object.keys(cart).filter(k=>cart[k]>0),...Object.keys(old)])];
  ids.sort((a,b)=>D.products.indexOf(pm[a])-D.products.indexOf(pm[b]));
  $('sheetTitle').textContent=MODE==='addon'?(had()?'確認修改後的補單':'確認要補的貨'):had()?'確認修改後的訂單':'確認這次叫的貨';
  $('sheetList').innerHTML=ids.map(pid=>{
    const p=pm[pid],n=cart[pid]||0,o=old[pid]||0;
    const chg=!had()||n===o?'':o===0?'新增':n===0?'取消':`原 ${qtyText(o,p.unit)}`;
    return `<div><span>${esc(p.name)}${chg?`<span class="chg">${chg}</span>`:''}</span><b>${n?esc(qtyText(n,p.unit)):'不要了'}</b></div>`;
  }).join('')||'<div><span>全部取消</span></div>';
  $('err').textContent='';$('sheet').classList.add('on');$('submit').focus();
}
async function submit(){
  const btn=$('submit');btn.disabled=true;btn.textContent='送出中…';
  try{
    const items=Object.entries(cart).filter(([,q])=>q>0).map(([pid,qty])=>({pid,qty}));
    const r=await fetch('/api/shop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,date:D.date,items,v:D.order?.v??null,mode:MODE,viaLiff:liffReady,draftId:D.draft?.id})});
    const j=await r.json();
    // 訂單剛被別的手機或 AI 改過：重新載入最新的單，請店家再確認一次
    if(r.status===409&&/剛剛有變動/.test(j.error||'')){const m=MODE;$('sheet').classList.remove('on');await load();if(m==='addon'&&D.addon)setMode('addon');toast(j.error);return}
    if(!r.ok)throw new Error(j.error||'送出失敗');
    const wasHad=had();
    D.order=j.order.items.length?j.order:null;D.draft=null;
    if(MODE==='addon')D.addon.order=D.order;else D.main.order=D.order;
    $('sheet').classList.remove('on');
    const word=MODE==='addon'?(!j.order.items.length?'取消補單':wasHad?'補單已更新':'補單已送出'):!j.order.items.length?'取消今天的訂單':wasHad?'訂單已更新':'訂單已送出';
    if(liffReady){
      // 用店家的身分在聊天室說一句話，機器人會回訂單卡
      try{await liff.sendMessages([{type:'text',text:word}]);liff.closeWindow();return}catch{}
    }
    showDone(word,j.order);
  }catch(e){$('err').textContent=e.message}
  finally{btn.disabled=false;btn.textContent='確認送出'}
}
function showDone(word,o){
  $('done').innerHTML=`<div class="ok" aria-hidden="true">${o.items.length?'✅':'🗑️'}</div><h2 style="margin:0">${word==='取消今天的訂單'?'這次的訂單已取消':word==='取消補單'?'補單已取消':word}</h2>
    ${o.items.length?`<p>${D.dateLabel} 配送，${D.cutoff} 前都還可以${MODE==='addon'?'補':'改'}</p><ul>${o.items.map(i=>`<li><span>${esc(i.name)}</span><b>${esc(qtyText(i.qty,i.unit))}</b></li>`).join('')}</ul>`:''}
    ${Q.get('proxy')?'<p>已經存進後台的出貨單。</p>':'<p>在 LINE 點「我的訂單」隨時可以查。</p>'}<button id="again">繼續修改</button>${Q.get('proxy')?'<button data-back="1" style="margin-top:8px">← 回後台</button>':''}`;
  $('done').classList.add('on');
  $('again').onclick=()=>{$('done').classList.remove('on');render()};
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){setMode(b.dataset.mode);return}
  if(b.dataset.cat){cat=b.dataset.cat;$('q').value='';renderChips();renderList();$('plist').scrollTop=0}
  // 代客叫貨回後台：從後台開的分頁就關掉回去，不然直接打開後台
  if(b.dataset.back){if(window.opener&&!window.opener.closed){window.opener.focus();window.close()}location.href='/admin';return}
  if(b.dataset.pk){const pid=b.dataset.pk;setQty(pid,Math.round(((cart[pid]||0)+(+b.dataset.n))*10000)/10000)}
  if(b.dataset.dq){const pid=b.dataset.pid,q=cart[pid]||0,d=+b.dataset.dq*(+b.dataset.f||1);setQty(pid,d<0&&q<-d?0:q+d)}
  if(b.dataset.repeat){const pm=PM();let skip=0;D.last.items.forEach(i=>{if(pm[i.pid]?.on)cart[i.pid]=i.qty;else skip++});render();toast(skip?`已帶入上次的品項，有 ${skip} 樣暫停供貨`:'已帶入上次的品項，可以再用 + − 調整')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.qin)setQty(t.dataset.qin,(+t.value||0)*(+t.dataset.f||1));
  if(t.dataset.jin){const v=+t.value||0,l=+t.closest('.prow').querySelector('select').value;setQty(t.dataset.jin,Number.isInteger(v)?v+l/16:Math.round(v*16)/16)}
});
document.addEventListener('focusin',e=>{if(e.target.dataset?.qin||e.target.dataset?.jin)e.target.select()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.dataset?.qin||e.target.dataset?.jin))e.target.blur()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.unit){const p=PM()[t.dataset.unit];UNIT[p.id]=t.value===p.unit?'':t.value;$('r-'+p.id).outerHTML=rowHTML(p);return}if(t.dataset.liang)setQty(t.dataset.liang,jinOf(cart[t.dataset.liang]||0)+(+t.value)/16)});
$('q').addEventListener('input',renderList);
$('review').addEventListener('click',openSheet);
$('back').addEventListener('click',()=>$('sheet').classList.remove('on'));
$('submit').addEventListener('click',submit);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').classList.remove('on')});
load();
</script>
</body>
</html>
