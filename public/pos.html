<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>門市收銀</title>

<style>
/* 門市收銀：平板橫放左邊品項、右邊結帳；手機上下排，結帳列固定在下面 */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;font-size:max(16px,1em);color:var(--ink)}
[hidden]{display:none!important}
.login{max-width:340px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.login .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700}
.login .err{color:var(--alert);font-size:.9rem;min-height:1.4em}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1400px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .logo{width:34px;height:34px}
.top h1{margin:0;font-size:1.15rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sum{font-size:.9rem;color:var(--muted);white-space:nowrap}
.top .sum b{color:var(--leaf);font-size:1.05rem}
.top button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-weight:700;white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;padding:12px 14px 0}
.left input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:6px 14px;color:var(--muted);font-weight:700}
.cats button[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding-bottom:16px}
.pbtn{position:relative;min-height:96px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pbtn:active{transform:scale(.98);background:var(--leaf-soft,#e5f4e4)}
.pbtn b{font-size:1.05rem;line-height:1.3}
.pbtn span{color:var(--leaf);font-weight:700}
.pbtn small{color:var(--muted);font-weight:400}
.pbtn .in{position:absolute;top:8px;right:8px;background:var(--leaf);color:#fff;border-radius:10px;padding:0 7px;font-size:.78rem;font-weight:700}
.right{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
.cart{flex:1;overflow-y:auto;padding:6px 14px}
.cart .empty{color:var(--muted);text-align:center;padding:40px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line button.ed{border:0;background:transparent;text-align:left;padding:0}
.line b{display:block}
.line small{color:var(--muted)}
.line .amt{font-weight:700;font-size:1.05rem}
.line .x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;min-height:40px}
.foot{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.row input{width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.total{font-size:1.6rem;font-weight:900}
.pay{width:100%;margin-top:8px;border:0;background:var(--leaf);color:#fff;border-radius:14px;padding:16px;font-size:1.25rem;font-weight:900;letter-spacing:.1em}
.pay:disabled{opacity:.4}
.clear{border:0;background:transparent;color:var(--muted);font-size:.9rem;padding:4px 0}
/* 彈窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.box{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:18px}
.box h3{margin:0 0 4px;font-size:1.2rem}
.box .sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.qin{display:flex;gap:8px;align-items:center;margin:8px 0}
.qin input{flex:1;min-width:0;font-size:1.6rem;font-weight:900;text-align:center;border:2px solid var(--leaf);border-radius:12px;padding:10px}
.qin span{font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:700;min-width:56px}
.chips button[aria-pressed=true]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;border-radius:12px;padding:13px;font-weight:900;font-size:1.05rem;border:1px solid var(--line);background:var(--bg)}
.acts .go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.big{font-size:2rem;font-weight:900;text-align:center;margin:6px 0}
.chg{font-size:1.3rem;font-weight:900;text-align:center;color:var(--leaf)}
.chg.neg{color:var(--alert)}
.hist .s{border-bottom:1px dashed var(--line);padding:10px 0}
.hist .s.void{opacity:.45}
.hist .s .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hist .s small{color:var(--muted)}
.hist .s .b{display:flex;gap:8px;margin-top:6px}
.hist .s .b button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
#receipt{display:none}
/* 手機：上下排，購物車變成下面的抽屜 */
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .right{border-left:0;border-top:1px solid var(--line);max-height:46vh}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .top .sum{display:none}
}
/* 收據（80mm 出單機） */
@media print{
  @page{size:80mm auto;margin:3mm}
  body>*:not(#receipt){display:none!important}
  #receipt{display:block;font-family:"Noto Sans TC",sans-serif;color:#000;width:72mm;font-size:12px}
  #receipt h2{text-align:center;margin:0 0 4px;font-size:16px}
  #receipt .c{text-align:center}
  #receipt table{width:100%;border-collapse:collapse;margin:6px 0}
  #receipt td{padding:2px 0;vertical-align:top}
  #receipt td.n{text-align:right;white-space:nowrap}
  #receipt .hr{border-top:1px dashed #000;margin:4px 0}
  #receipt .tot td{font-weight:900;font-size:14px}
}
</style>
</head>

  <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2.5c1.3 2.4 1.2 4.7.3 6.6C22 10.4 27.5 14.7 27.5 20.6c0 5.6-5.1 8.9-11.5 8.9S4.5 26.2 4.5 20.6c0-5.9 5.5-10.2 11.2-11.5-.9-1.9-1-4.2.3-6.6z" fill="currentColor"/><path d="M16 11.5c-2.6 2.9-3.6 6.1-3.6 9.3 0 3 1.1 5.5 3.6 7.4m0-16.7c2.6 2.9 3.6 6.1 3.6 9.3 0 3-1.1 5.5-3.6 7.4" stroke="#1F4D3A" stroke-opacity=".55" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></span><h2>叫貨後台</h2>
  <div class="err" id="loginErr" role="alert"></div>
  <button id="loginBtn" class="gbtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>用 Google 登入</button>
</form>

  <header class="top">

<script type="module">
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const fmtQ=q=>Number.isInteger(q)?q:(+q.toFixed(2));
function qtyText(q,unit){q=Number(q)||0;if(unit==='斤'&&!Number.isInteger(q)){let j=Math.floor(q),l=Math.round((q-j)*16);if(l===16){j++;l=0}if(Math.abs(j+l/16-q)<0.001)return `${j?j+'斤':''}${l?l+'兩':''}`||'0斤'}return `${Number.isInteger(q)?q:+q.toFixed(2)} ${unit}`}
const r4=n=>Math.round(n*10000)/10000;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}

/* ---------- 登入（跟後台同一套 Google 帳號） ---------- */
const SDK='https://www.gstatic.com/firebasejs/12.4.0/';
let FB=null;
async function initAuth(){
  const [{initializeApp},A]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js')]);
  const local=['localhost','127.0.0.1'].includes(location.hostname);
  const config=local?{apiKey:'demo-key',authDomain:location.host,projectId:'garlic-wholesale'}:await (await fetch('/__/firebase/init.json')).json();
  if(!local)config.authDomain=location.host;
  const auth=A.getAuth(initializeApp(config));
  if(!local)A.getRedirectResult(auth).catch(e=>{$('login').hidden=false;$('loginErr').textContent='登入失敗：'+e.code});
  if(local)A.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});
  FB={auth,...A};
  A.onAuthStateChanged(auth,u=>{if(u)load();else showLogin()});
}
function showLogin(msg){$('app').hidden=true;$('login').hidden=false;$('loginErr').textContent=msg||''}
$('loginBtn').addEventListener('click',async()=>{
  try{const p=new FB.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    if(navigator.standalone||matchMedia('(display-mode: standalone)').matches){await FB.signInWithRedirect(FB.auth,p);return}
    await FB.signInWithPopup(FB.auth,p)}catch(e){if(!/popup-closed|cancelled-popup/.test(e.code))$('loginErr').textContent='登入失敗：'+e.code}
});
async function api(method,body,q=''){
  const token=await FB.auth.currentUser?.getIdToken();
  const r=await fetch('/api/admin'+q,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token||'')},body:body&&JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'伺服器沒有回應，請檢查網路'}));
  if(r.status===401||r.status===403){showLogin(j.error);throw new Error(j.error)}
  if(!r.ok)throw new Error(j.error||'失敗');
  return j;
}

/* ---------- 資料 ---------- */
let D=null,cat='全部',cart=[],method='現金',editing=null;
const PM=()=>Object.fromEntries(D.products.map(p=>[p.id,p]));
async function load(){
  try{D=await api('GET',null,'?pos='+(D?.today||''))}catch(e){toast(e.message);return}
  $('login').hidden=true;$('app').hidden=false;
  if(D.palette)document.documentElement.dataset.palette=D.palette;
  window.applyBrand?.({logo:D.shop.logo,name:D.shop.name});
  try{$('autoPrint').checked=localStorage.getItem('posPrint')!=='0'}catch{$('autoPrint').checked=true}
  renderAll();
}
function renderAll(){renderCats();renderGrid();renderCart();renderSum()}
function renderSum(){const s=D.summary;$('sum').innerHTML=`今日 ${s.count} 筆　<b>${money(s.total)}</b>`}
function renderCats(){
  $('cats').innerHTML=['全部',...D.categories].filter(c=>c==='全部'||D.products.some(p=>p.cat===c)).map(c=>`<button data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('');
}
function renderGrid(){
  const q=$('q').value.trim();
  const inCart=Object.fromEntries(cart.map(l=>[l.pid,l]));
  const ps=D.products.filter(p=>(cat==='全部'||p.cat===cat)&&(!q||p.name.includes(q)));
  $('grid').innerHTML=ps.map(p=>`<button class="pbtn" data-p="${p.id}">${inCart[p.id]?`<span class="in">${esc(qtyText(inCart[p.id].qty,p.unit))}</span>`:''}<b>${esc(p.name)}</b><span>${money(p.price)}<small>／${esc(p.unit)}</small></span></button>`).join('')||'<p style="color:var(--muted)">找不到品項</p>';
}
const sub=()=>cart.reduce((a,l)=>a+Math.round(l.qty*l.price),0);
const disc=()=>Math.max(0,Math.min(sub(),Math.round(+$('disc').value||0)));
const total=()=>sub()-disc();
function renderCart(){
  $('cart').innerHTML=cart.length?cart.map((l,i)=>`<div class="line"><button class="ed" data-ed="${i}"><b>${esc(l.name)}</b><small>${esc(qtyText(l.qty,l.unit))} × ${money(l.price)}</small></button><span class="amt">${money(l.qty*l.price)}</span><button class="x" data-rm="${i}" aria-label="移除${esc(l.name)}">✕</button></div>`).join(''):'<div class="empty">點左邊的品項加入</div>';
  $('subtotal').textContent=money(sub());$('total').textContent=money(total());$('payBtn').disabled=!cart.length;
  renderGrid();
}

/* ---------- 加品項：論斤（或能叫到兩）的跳出數量；其他點一下 +1 ---------- */
function addProduct(p){
  const l=cart.find(x=>x.pid===p.id);
  if(p.unit==='斤'||p.unit==='公斤'||p.unit==='兩'){openQty(p,l);return}
  if(l)l.qty=r4(l.qty+1);else cart.push({pid:p.id,name:p.name,unit:p.unit,qty:1,price:p.price});
  renderCart();
}
function openQty(p,l){
  editing={p,l};
  $('qtyT').textContent=p.name;$('qtySub').textContent=`${money(p.price)}／${p.unit}`;
  const q=l?.qty||0,jin=p.unit==='斤'&&p.liang;
  $('qtyIn').innerHTML=jin
    ?`<input id="qJin" type="number" inputmode="numeric" min="0" value="${q?Math.floor(q):''}" placeholder="0"><span>斤</span><input id="qLiang" type="number" inputmode="numeric" min="0" max="15" value="${q?Math.round((q-Math.floor(q))*16)||'':''}" placeholder="0"><span>兩</span>`
    :`<input id="qN" type="number" inputmode="decimal" min="0" step="any" value="${q?fmtQ(q):''}" placeholder="0"><span>${esc(p.unit)}</span>`;
  $('qtyQuick').innerHTML=(jin?[0.5,1,2,3,5,10]:[0.5,1,2,3,5,10]).map(n=>`<button data-qq="${n}">${jin&&n===0.5?'半斤':n+(p.unit)}</button>`).join('');
  $('qtyPrice').value=l?l.price:p.price;$('qtyUnit').textContent='／'+p.unit;
  $('qtyM').classList.add('on');setTimeout(()=>($('qJin')||$('qN')).focus(),50);
}
function readQty(){
  if($('qJin'))return r4((+$('qJin').value||0)+Math.min(15,+$('qLiang').value||0)/16);
  return r4(+$('qN').value||0);
}
function setQtyInputs(n){if($('qJin')){$('qJin').value=Math.floor(n);$('qLiang').value=Math.round((n-Math.floor(n))*16)||''}else $('qN').value=n}
function saveQty(){
  const {p,l}=editing,q=readQty(),price=Math.max(0,+$('qtyPrice').value||0);
  if(!(q>0)){if(l)cart.splice(cart.indexOf(l),1)}
  else if(l){l.qty=q;l.price=price}
  else cart.push({pid:p.id,name:p.name,unit:p.unit,qty:q,price});
  $('qtyM').classList.remove('on');editing=null;renderCart();
}

/* ---------- 結帳（不接線上金流，付款方式只是記錄） ---------- */
function openPay(){
  method='現金';$('payTotal').textContent=money(total());$('paid').value='';
  $('methods').innerHTML=D.pay.map(m=>`<button data-m="${esc(m)}" aria-pressed="${m===method}">${esc(m)}</button>`).join('');
  const t=total(),q=[...new Set([t,Math.ceil(t/100)*100,Math.ceil(t/500)*500,Math.ceil(t/1000)*1000])].filter(n=>n>=t).slice(0,4);
  $('cashQuick').innerHTML=q.map(n=>`<button data-cash="${n}">${n===t?'剛好 ':''}${money(n)}</button>`).join('');
  renderChange();$('cashBox').hidden=false;$('payM').classList.add('on');
}
function renderChange(){
  const t=total(),p=+$('paid').value||0;
  $('change').className='chg'+(p&&p<t?' neg':'');
  $('change').textContent=!p?'':p<t?`還差 ${money(t-p)}`:`找零 ${money(p-t)}`;
}
async function doPay(){
  const t=total(),paid=method==='現金'?(+$('paid').value||t):t;
  if(method==='現金'&&paid<t){toast('收的錢不夠');return}
  $('payOk').disabled=true;
  try{
    const j=await api('POST',{action:'posCheckout',items:cart.map(l=>({pid:l.pid,qty:l.qty,price:l.price})),discount:disc(),method,paid});
    const s=j.sale;D.sales.unshift(s);D.summary.count++;D.summary.total+=s.total;D.summary.by[s.method]=(D.summary.by[s.method]||0)+s.total;
    $('payM').classList.remove('on');
    toast(`已結帳 ${money(s.total)}${s.change?`，找零 ${money(s.change)}`:''}`);
    cart=[];$('disc').value='';renderCart();renderSum();
    if($('autoPrint').checked)printReceipt(s);
  }catch(e){toast(e.message)}finally{$('payOk').disabled=false}
}

/* ---------- 收據 ---------- */
function printReceipt(s){
  const t=new Date(s.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
  $('receipt').innerHTML=`<h2>${esc(D.shop.name)}</h2><div class="c">收據 ${esc(s.no)}<br>${esc(t)}</div><div class="hr"></div>
  <table>${s.items.map(i=>`<tr><td>${esc(i.name)}<br>${esc(qtyText(i.qty,i.unit))} × ${money(i.price)}</td><td class="n">${money(i.amount)}</td></tr>`).join('')}</table><div class="hr"></div>
  <table>${s.discount?`<tr><td>小計</td><td class="n">${money(s.subtotal)}</td></tr><tr><td>折扣</td><td class="n">-${money(s.discount)}</td></tr>`:''}
  <tr class="tot"><td>合計</td><td class="n">${money(s.total)}</td></tr><tr><td>${esc(s.method)}</td><td class="n">${money(s.paid)}</td></tr>${s.change?`<tr><td>找零</td><td class="n">${money(s.change)}</td></tr>`:''}</table>
  <div class="hr"></div><div class="c">謝謝光臨${D.shop.phone?`<br>${esc(D.shop.phone)}`:''}</div>${s.void?'<h2>＊已作廢＊</h2>':''}`;
  setTimeout(()=>window.print(),50);
}

/* ---------- 今日交易：補印、作廢 ---------- */
function renderHist(){
  const s=D.summary;
  $('histSum').textContent=`${s.count} 筆，共 ${money(s.total)}　${Object.entries(s.by).map(([k,v])=>`${k} ${money(v)}`).join('・')}${s.voided?`　（作廢 ${s.voided} 筆）`:''}`;
  $('hist').innerHTML=D.sales.length?D.sales.map(x=>`<div class="s ${x.void?'void':''}"><div class="h"><span>${esc(x.no)}　${new Date(x.at).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false})}</span><span>${money(x.total)}　${esc(x.method)}</span></div>
    <small>${x.items.map(i=>`${esc(i.name)} ${esc(qtyText(i.qty,i.unit))}`).join('、')}${x.void?`<br>已作廢：${esc(x.void.reason||'')}（${esc(x.void.by)}）`:''}</small>
    <div class="b"><button data-reprint="${x.id}">補印收據</button>${x.void?'':`<button data-void="${x.id}">作廢</button>`}</div></div>`).join(''):'<p style="color:var(--muted)">今天還沒有交易</p>';
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cat){cat=b.dataset.cat;renderCats();renderGrid()}
  if(b.dataset.p)addProduct(PM()[b.dataset.p]);
  if(b.dataset.ed){const l=cart[+b.dataset.ed];openQty(PM()[l.pid]||{id:l.pid,name:l.name,unit:l.unit,price:l.price},l)}
  if(b.dataset.rm){cart.splice(+b.dataset.rm,1);renderCart()}
  if(b.dataset.qq)setQtyInputs(+b.dataset.qq);
  if(b.id==='qtyOk')saveQty();
  if(b.id==='qtyCancel'){$('qtyM').classList.remove('on');editing=null}
  if(b.id==='payBtn')openPay();
  if(b.id==='payCancel')$('payM').classList.remove('on');
  if(b.id==='payOk')doPay();
  if(b.dataset.m){method=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('cashBox').hidden=method!=='現金'}
  if(b.dataset.cash){$('paid').value=b.dataset.cash;renderChange()}
  if(b.id==='clearBtn'&&cart.length&&confirm('清空這次的品項？')){cart=[];$('disc').value='';renderCart()}
  if(b.id==='histBtn'){renderHist();$('histM').classList.add('on');try{const j=await api('GET',null,'?pos='+D.today);D.sales=j.sales;D.summary=j.summary;renderHist();renderSum()}catch{}}
  if(b.id==='histClose')$('histM').classList.remove('on');
  if(b.dataset.reprint)printReceipt(D.sales.find(x=>x.id===b.dataset.reprint));
  if(b.dataset.void){
    const x=D.sales.find(s=>s.id===b.dataset.void);const reason=prompt(`作廢收據 ${x.no}（${money(x.total)}）？請寫原因`,'打錯');if(reason===null)return;
    try{const j=await api('POST',{action:'posVoid',id:x.id,reason});D.sales=j.sales;D.summary=j.summary;renderHist();renderSum();toast('已作廢')}catch(err){toast(err.message)}
  }
  if(b.id==='adminBtn')location.href='/admin';
});
$('q').addEventListener('input',renderGrid);
$('disc').addEventListener('input',renderCart);
$('paid').addEventListener('input',renderChange);
$('autoPrint').addEventListener('change',e=>{try{localStorage.setItem('posPrint',e.target.checked?'1':'0')}catch{}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('qtyM').classList.contains('on')){e.preventDefault();saveQty()}if(e.key==='Escape')document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on'))});
initAuth();
</script>
</body>
</html>
