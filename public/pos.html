<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>門市收銀</title>
<link rel="stylesheet" href="/theme.css">
<script src="/brand.js" data-fetch="1"></script>
<style>
/* 門市收銀：平板橫放左邊品項、右邊結帳；手機上下排，結帳列固定在下面 */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;font-size:max(16px,1em);color:var(--ink)}
[hidden]{display:none!important}
.login{max-width:340px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
.login .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700}
.login .err{color:var(--alert);font-size:.9rem;min-height:1.4em}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1400px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .logo{width:34px;height:34px}
.top h1{margin:0;font-size:1.15rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sum{font-size:.9rem;color:var(--muted);white-space:nowrap}
.top .sum b{color:var(--leaf);font-size:1.05rem}
.top button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-weight:700;white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;padding:12px 14px 0}
.left input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:6px 14px;color:var(--muted);font-weight:700}
.cats button[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;padding-bottom:16px}
.pbtn{position:relative;min-height:96px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pbtn:active{transform:scale(.98);background:var(--leaf-soft,#e5f4e4)}
.pbtn b{font-size:1.05rem;line-height:1.3}
.pbtn span{color:var(--leaf);font-weight:700}
.pbtn small{color:var(--muted);font-weight:400}
.pbtn .in{position:absolute;top:8px;right:8px;background:var(--leaf);color:#fff;border-radius:10px;padding:0 7px;font-size:.78rem;font-weight:700}
.right{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
.cart{flex:1;overflow-y:auto;padding:6px 14px}
.cart .empty{color:var(--muted);text-align:center;padding:40px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.line button.ed{border:0;background:transparent;text-align:left;padding:0}
.line b{display:block}
.line small{color:var(--muted)}
.line .amt{font-weight:700;font-size:1.05rem}
.line .x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;min-height:40px}
.foot{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.row input{width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.total{font-size:1.6rem;font-weight:900}
.pay{width:100%;margin-top:8px;border:0;background:var(--leaf);color:#fff;border-radius:14px;padding:16px;font-size:1.25rem;font-weight:900;letter-spacing:.1em}
.pay:disabled{opacity:.4}
.clear{border:0;background:transparent;color:var(--muted);font-size:.9rem;padding:4px 0}
/* 彈窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.box{background:var(--surface);border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:18px}
.box h3{margin:0 0 4px;font-size:1.2rem}
.box .sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.qin{display:flex;gap:8px;align-items:center;margin:8px 0}
.qin input{flex:1;min-width:0;font-size:1.6rem;font-weight:900;text-align:center;border:2px solid var(--leaf);border-radius:12px;padding:10px}
.qin span{font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:700;min-width:56px}
.chips button[aria-pressed=true]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;border-radius:12px;padding:13px;font-weight:900;font-size:1.05rem;border:1px solid var(--line);background:var(--bg)}
.acts .go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.big{font-size:2rem;font-weight:900;text-align:center;margin:6px 0}
.chg{font-size:1.3rem;font-weight:900;text-align:center;color:var(--leaf)}
.chg.neg{color:var(--alert)}
.hist .s{border-bottom:1px dashed var(--line);padding:10px 0}
.hist .s.void{opacity:.45}
.hist .s .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hist .s small{color:var(--muted)}
.hist .s .b{display:flex;gap:8px;margin-top:6px}
.hist .s .b button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2a22;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}

/* 分頁 */
.ptabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
.ptabs button{flex:none;border:0;background:transparent;padding:11px 14px;font-weight:700;color:var(--muted);box-shadow:inset 0 -3px 0 transparent}
.ptabs button[aria-selected=true]{color:var(--leaf);box-shadow:inset 0 -3px 0 var(--leaf)}
.ptabs .n{display:inline-block;margin-left:4px;background:var(--alert);color:#fff;border-radius:9px;padding:0 6px;font-size:.75rem}
.app{grid-template-rows:auto auto 1fr}
.pane{overflow-y:auto;padding:16px;max-width:980px;width:100%;margin:0 auto}
.pane h2{margin:4px 0 10px;font-size:1.15rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-size:1.05rem}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn.red{color:var(--alert)}
.list .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.list .it small{display:block;color:var(--muted)}
.list .it .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.list .it.void{opacity:.45}
.diff{font-size:1.4rem;font-weight:900}
.diff.neg{color:var(--alert)}.diff.pos{color:#B07A00}.diff.ok{color:var(--leaf)}
.warnbar{background:#f9eeda;color:#6b4e00;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.stk{width:100%;border-collapse:collapse}
.stk th,.stk td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.stk td.n,.stk th.n{text-align:right;white-space:nowrap}
.stk .low{color:var(--alert);font-weight:900}
.stk input{width:70px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg)}
.pbtn .st{font-size:.75rem;color:var(--muted)}
.pbtn .st.low{color:var(--alert);font-weight:700}
.ptabs .ti{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px;vertical-align:-4px}
/* 電腦、平板橫放：分頁放左側（跟後台一樣）；手機在上面 */
@media (min-width:900px){
  .app{grid-template-columns:168px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .top{grid-column:1/-1}
  .ptabs{grid-column:1;grid-row:2;flex-direction:column;gap:2px;padding:12px 8px;border-bottom:0;border-right:1px solid var(--line);overflow:visible}
  .ptabs button{display:flex;align-items:center;text-align:left;border-radius:10px;padding:11px 12px;box-shadow:none}
  .ptabs button:hover{background:var(--bg);color:var(--ink)}
  .ptabs button[aria-selected=true]{background:var(--bg);color:var(--leaf);box-shadow:inset 3px 0 0 var(--leaf)}
  .ptabs .n{margin-left:auto}
  #sellV,#paneV{grid-column:2;grid-row:2;min-height:0}
  .pane{max-width:none}
}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keypad button{min-height:62px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:1.5rem;font-weight:900}
.keypad button:active{background:var(--leaf);color:#fff}
.keypad .z{grid-column:span 3}
.keypad [data-k="⌫"],.keypad [data-k="C"]{font-size:1.05rem;color:var(--muted)}
input.kp{caret-color:transparent;cursor:pointer}
input.kpon{border-color:var(--leaf)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 25%,transparent)}
.cust{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:.92rem}
.cust b{color:var(--leaf)}
#receipt{display:none}
/* 手機：上下排，購物車變成下面的抽屜 */
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .right{border-left:0;border-top:1px solid var(--line);max-height:46vh}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .top .sum{display:none}
}
/* 收據（80mm 出單機） */
@media print{
  @page{size:80mm auto;margin:3mm}
  body>*:not(#receipt){display:none!important}
  #receipt{display:block;font-family:"Noto Sans TC",sans-serif;color:#000;width:72mm;font-size:12px}
  #receipt h2{text-align:center;margin:0 0 4px;font-size:16px}
  #receipt .c{text-align:center}
  #receipt table{width:100%;border-collapse:collapse;margin:6px 0}
  #receipt td{padding:2px 0;vertical-align:top}
  #receipt td.n{text-align:right;white-space:nowrap}
  #receipt .hr{border-top:1px dashed #000;margin:4px 0}
  #receipt .tot td{font-weight:900;font-size:14px}
}
</style>
</head>
<body class="admin">
<form class="login" id="login" hidden onsubmit="return false">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2.5c1.3 2.4 1.2 4.7.3 6.6C22 10.4 27.5 14.7 27.5 20.6c0 5.6-5.1 8.9-11.5 8.9S4.5 26.2 4.5 20.6c0-5.9 5.5-10.2 11.2-11.5-.9-1.9-1-4.2.3-6.6z" fill="currentColor"/><path d="M16 11.5c-2.6 2.9-3.6 6.1-3.6 9.3 0 3 1.1 5.5 3.6 7.4m0-16.7c2.6 2.9 3.6 6.1 3.6 9.3 0 3-1.1 5.5-3.6 7.4" stroke="#1F4D3A" stroke-opacity=".55" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></span><h2>叫貨後台</h2>
  <div class="err" id="loginErr" role="alert"></div>
  <button id="loginBtn" class="gbtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>用 Google 登入</button>
</form>



<div class="app" id="app" hidden>
  <header class="top">
    <span class="logo" aria-hidden="true"></span>
    <h1><span data-shopname></span> 門市收銀</h1>
    <span class="sum" id="sum"></span>
    <button id="adminBtn" type="button">後台</button>
  </header>
  <nav class="ptabs" role="tablist">
    <button data-v="sell" aria-selected="true"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 8h4M7 12h2"/></svg>收銀</button>
    <button data-v="holds"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-6-4-6 4z"/></svg>掛單<span class="n" id="holdN" hidden></span></button>
    <button data-v="hist"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg>交易紀錄</button>
    <button data-v="cash"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>錢櫃日結</button>
    <button data-v="stock"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/></svg>庫存</button>
    <button data-v="cust"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>常客</button>
  </nav>
  <div class="main" id="sellV">
    <section class="left">
      <div class="warnbar" id="openBar" hidden><span>今天還沒開班（錢櫃零用金）</span><button class="btn sm go" data-v="cash">去開班</button></div>
      <input type="search" id="q" placeholder="找品項" aria-label="找品項">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="right">
      <div class="cust" id="custBar"></div>
      <div class="cart" id="cart"></div>
      <div class="foot">
        <div class="row"><span>小計</span><span id="subtotal">$0</span></div>
        <div class="row"><label for="disc" id="discL">折扣／抹零</label><input id="disc" class="kp" inputmode="none" readonly data-ask="折扣／抹零（少收多少元）" data-int="1" placeholder="0"></div>
        <div class="row"><b>應收</b><span class="total" id="total">$0</span></div>
        <button class="pay" id="payBtn" type="button" disabled>結帳</button>
        <div class="row"><span><button class="clear" id="clearBtn" type="button">清空</button>　<button class="clear" id="holdBtn" type="button">掛單</button></span><label class="clear" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="autoPrint">結帳後印收據</label></div>
      </div>
    </section>
  </div>
  <div class="pane" id="paneV" hidden></div>
</div>

<!-- 數量（論斤的品項、或改數量、改單價） -->
<div class="modal" id="qtyM" role="dialog" aria-modal="true" aria-labelledby="qtyT"><div class="box">
  <h3 id="qtyT"></h3><p class="sub" id="qtySub"></p>
  <div class="chips" id="qtyMode"></div>
  <div class="qin" id="qtyIn"></div>
  <div class="chips" id="qtyQuick"></div>
  <div class="qin"><span id="qtyPL">單價 $</span><input id="qtyPrice" class="kp" inputmode="none" style="font-size:1.2rem"><span id="qtyUnit"></span></div>
  <div id="qtyKp"></div>
  <div class="acts"><button type="button" id="qtyCancel">取消</button><button type="button" class="go" id="qtyOk">確定</button></div>
</div></div>

<!-- 結帳 -->
<div class="modal" id="payM" role="dialog" aria-modal="true" aria-labelledby="payT"><div class="box">
  <h3 id="payT">結帳</h3>
  <div class="big" id="payTotal"></div>
  <div class="chips" id="methods"></div>
  <div id="noteBox" hidden><input id="payNote" maxlength="40" placeholder="匯款末五碼／支票號碼、到期日（可以空白）" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:1rem"></div>
  <div id="cashBox">
    <div class="qin"><span>收</span><input id="paid" class="kp" inputmode="none" data-int="1"><span>元</span></div>
    <div class="chips" id="cashQuick"></div>
    <div class="chg" id="change"></div>
    <div id="payKp"></div>
  </div>
  <div class="acts"><button type="button" id="payCancel">取消</button><button type="button" class="go" id="payOk">完成結帳</button></div>
</div></div>

<!-- 選常客 -->
<div class="modal" id="custM" role="dialog" aria-modal="true" aria-labelledby="custT"><div class="box">
  <h3 id="custT">選常客</h3>
  <input type="search" id="custQ" placeholder="打名字或電話" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)">
  <div class="list" id="custList"></div>
  <div class="acts"><button type="button" id="custClose">關閉</button><button type="button" class="go" id="custNew">＋ 新增常客</button></div>
</div></div>

<!-- 編輯常客 -->
<div class="modal" id="cedM" role="dialog" aria-modal="true" aria-labelledby="cedT"><div class="box">
  <h3 id="cedT">常客資料</h3>
  <div class="form" style="flex-direction:column;align-items:stretch">
    <label>名字<input id="cName" maxlength="30"></label>
    <label>電話<input id="cPhone" type="tel" inputmode="tel" maxlength="20"></label>

<div class="toast" id="toast" role="status"></div>
<div id="receipt"></div>
<script type="module">
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const fmtQ=q=>Number.isInteger(q)?q:(+q.toFixed(2));
function qtyText(q,unit){if(unit==='散賣')return '散賣';q=Number(q)||0;if(unit==='斤'&&!Number.isInteger(q)){let j=Math.floor(q),l=Math.round((q-j)*16);if(l===16){j++;l=0}if(Math.abs(j+l/16-q)<0.001)return `${j?j+'斤':''}${l?l+'兩':''}`||'0斤'}return `${Number.isInteger(q)?q:+q.toFixed(2)} ${unit}`}
const r4=n=>Math.round(n*10000)/10000;
const lineText=l=>l.unit==='散賣'?'散賣':`${qtyText(l.qty,l.unit)} × ${money(l.price)}`;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}

/* ---------- 登入（跟後台同一套 Google 帳號） ---------- */
const SDK='https://www.gstatic.com/firebasejs/12.4.0/';
let FB=null;
async function initAuth(){
  const [{initializeApp},A]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js')]);
  const local=['localhost','127.0.0.1'].includes(location.hostname);
  const config=local?{apiKey:'demo-key',authDomain:location.host,projectId:'garlic-wholesale'}:await (await fetch('/__/firebase/init.json')).json();
  if(!local)config.authDomain=location.host;
  const auth=A.getAuth(initializeApp(config));
  if(!local)A.getRedirectResult(auth).catch(e=>{$('login').hidden=false;$('loginErr').textContent='登入失敗：'+e.code});
  if(local)A.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});
  FB={auth,...A};
  A.onAuthStateChanged(auth,u=>{if(u)load();else showLogin()});
}
function showLogin(msg){$('app').hidden=true;$('login').hidden=false;$('loginErr').textContent=msg||''}
$('loginBtn').addEventListener('click',async()=>{
  try{const p=new FB.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    if(navigator.standalone||matchMedia('(display-mode: standalone)').matches){await FB.signInWithRedirect(FB.auth,p);return}
    await FB.signInWithPopup(FB.auth,p)}catch(e){if(!/popup-closed|cancelled-popup/.test(e.code))$('loginErr').textContent='登入失敗：'+e.code}
});
async function api(method,body,q=''){
  const token=await FB.auth.currentUser?.getIdToken();
  const r=await fetch('/api/admin'+q,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(token||'')},body:body&&JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'伺服器沒有回應，請檢查網路'}));
  if(r.status===401||r.status===403){showLogin(j.error);throw new Error(j.error)}
  if(!r.ok)throw new Error(j.error||'失敗');
  return j;
}

/* ---------- 資料 ---------- */
let D=null,view='sell',cat='全部',cart=[],method='現金',editing=null,cust=null,discManual=false,editCust=null,H=null,histQ='';
const PM=()=>Object.fromEntries(D.products.map(p=>[p.id,p]));
const CM=()=>Object.fromEntries(D.customers.map(c=>[c.id,c]));
const tm=iso=>new Date(iso).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false});
async function load(){
  try{D=await api('GET',null,'?pos=')}catch(e){toast(e.message);return}
  $('login').hidden=true;$('app').hidden=false;
  if(D.palette)document.documentElement.dataset.palette=D.palette;
  window.applyBrand?.({logo:D.shop.logo,name:D.shop.name});
  try{$('autoPrint').checked=localStorage.getItem('posPrint')!=='0'}catch{$('autoPrint').checked=true}
  renderAll();
}
function renderAll(){renderTop();renderCats();renderGrid();renderCart();if(view!=='sell')renderPane()}
function renderTop(){
  const s=D.summary;$('sum').innerHTML=`今日 ${s.count} 筆　<b>${money(s.total)}</b>`;
  $('holdN').hidden=!D.holds.length;$('holdN').textContent=D.holds.length;
  $('openBar').hidden=!!D.day.open;
}
function showView(v){
  view=v;document.querySelectorAll('.ptabs [data-v]').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  $('sellV').hidden=v!=='sell';$('paneV').hidden=v==='sell';
  if(v!=='sell')renderPane();
}

/* ---------- 收銀 ---------- */
function renderCats(){
  $('cats').innerHTML=['全部',...D.categories].filter(c=>c==='全部'||D.products.some(p=>p.cat===c)).map(c=>`<button data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('');
}
const stockOf=pid=>D.stock.items[pid];
const isLow=pid=>stockOf(pid)!=null&&D.stock.low[pid]!=null&&stockOf(pid)<=D.stock.low[pid];
function renderGrid(){
  const q=$('q').value.trim();
  const inCart=Object.fromEntries(cart.map(l=>[l.pid,l]));
  const ps=D.products.filter(p=>(cat==='全部'||p.cat===cat)&&(!q||p.name.includes(q)));
  $('grid').innerHTML=ps.map(p=>{const st=stockOf(p.id);return `<button class="pbtn" data-p="${p.id}">${inCart[p.id]?`<span class="in">${esc(qtyText(inCart[p.id].qty,inCart[p.id].unit))}</span>`:''}<b>${esc(p.name)}</b><span>${money(p.price)}<small>／${esc(p.unit)}</small>${st!=null?`<br><small class="st ${isLow(p.id)?'low':''}">剩 ${esc(qtyText(st,p.unit))}</small>`:''}</span></button>`}).join('')||'<p style="color:var(--muted)">找不到品項</p>';
}
const sub=()=>cart.reduce((a,l)=>a+Math.round(l.qty*l.price),0);
// 常客有專屬折扣：自動算好填進折扣（自己改過就照自己打的）
const memberDisc=()=>cust?.discount?Math.round(sub()*(100-cust.discount)/100):0;
const disc=()=>Math.max(0,Math.min(sub(),Math.round(+$('disc').value||0)));
const total=()=>sub()-disc();
function renderCart(){
  if(!discManual)$('disc').value=memberDisc()||'';
  $('discL').textContent=cust?.discount&&!discManual?`會員 ${cust.discount} 折`:'折扣／抹零';
  $('custBar').innerHTML=cust?`<span>常客：<b>${esc(cust.name)}</b>${cust.discount?`（${cust.discount} 折）`:''}</span><button class="btn sm" id="custOff">取消</button>`:`<span style="color:var(--muted)">一般客人</span><button class="btn sm" id="custPick">＋ 選常客</button>`;
  $('cart').innerHTML=cart.length?cart.map((l,i)=>`<div class="line"><button class="ed" data-ed="${i}"><b>${esc(l.name)}</b><small>${esc(lineText(l))}</small></button><span class="amt">${money(l.qty*l.price)}</span><button class="x" data-rm="${i}" aria-label="移除${esc(l.name)}">✕</button></div>`).join(''):'<div class="empty">點左邊的品項加入</div>';
  $('subtotal').textContent=money(sub());$('total').textContent=money(total());$('payBtn').disabled=!cart.length;
  renderGrid();
}
function resetSale(){cart=[];cust=null;discManual=false;$('disc').value='';renderCart()}
function addProduct(p){
  const l=cart.find(x=>x.pid===p.id);
  if(JIN[p.unit]){openQty(p,l);return}
  if(l&&l.unit===p.unit)l.qty=r4(l.qty+1);else if(!l)cart.push({pid:p.id,name:p.name,unit:p.unit,qty:1,price:p.price});else{openQty(p,l);return}
  renderCart();
}
/* 賣法：論斤的可以改用公斤、論顆／個、散賣（直接打金額）；換成公斤時單價自動換算 */
const JIN={斤:1,兩:1/16,公斤:1/0.6};// 換成台斤（1 台斤 = 0.6 公斤）
const LP={};// 這次開著收銀頁時，各品項論顆、論個上次打的單價
const modesOf=p=>[...new Set(JIN[p.unit]?[p.unit,'斤','公斤','顆','個','散賣']:[p.unit,'散賣'])];
function openQty(p,l){
  editing={p,l};
  $('qtyT').textContent=p.name;$('qtySub').textContent=`${money(p.price)}／${p.unit}${stockOf(p.id)!=null?`　庫存 ${qtyText(stockOf(p.id),p.unit)}`:''}`;
  $('qtyMode').innerHTML=modesOf(p).map(u=>`<button type="button" data-qm="${esc(u)}">${u==='斤'&&p.liang?'斤兩':esc(u)}</button>`).join('');
  $('qtyKp').innerHTML=keypad();$('qtyM').classList.add('on');
  setMode(l?.unit||p.unit);
}
function setMode(u){
  const {p,l}=editing,same=l?.unit===u,q=same?l.qty:0,jin=u==='斤'&&p.liang,loose=u==='散賣';
  editing.u=u;
  document.querySelectorAll('[data-qm]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.qm===u));
  $('qtyIn').hidden=$('qtyQuick').hidden=loose;
  $('qtyIn').innerHTML=loose?'':jin
    ?`<input id="qJin" class="kp" inputmode="none" data-int="1" value="${q?Math.floor(q):''}" placeholder="0"><span>斤</span><input id="qLiang" class="kp" inputmode="none" data-int="1" data-max="15" value="${q?Math.round((q-Math.floor(q))*16)||'':''}" placeholder="0"><span>兩</span>`
    :`<input id="qN" class="kp" inputmode="none" ${JIN[u]?'':'data-int="1"'} value="${q?fmtQ(q):''}" placeholder="0"><span>${esc(u)}</span>`;
  $('qtyQuick').innerHTML=loose?'':(JIN[u]?[0.5,1,2,3,5,10]:[1,2,3,5,10,20]).map(n=>`<button data-qq="${n}">${jin&&n===0.5?'半斤':n+u}</button>`).join('');
  const price=same?l.price:u===p.unit?p.price:JIN[u]&&JIN[p.unit]?Math.round(p.price*JIN[u]/JIN[p.unit]*100)/100:(LP[p.id+u]??'');
  $('qtyPrice').value=price;$('qtyPL').textContent=loose?'金額 $':'單價 $';$('qtyUnit').textContent=loose?'':'／'+u;
  kpTarget(loose?$('qtyPrice'):($('qJin')||$('qN')));
}
function readQty(){if(editing.u==='散賣')return 1;if($('qJin'))return r4((+$('qJin').value||0)+Math.min(15,+$('qLiang').value||0)/16);return r4(+$('qN').value||0)}
function setQtyInputs(n){if($('qJin')){$('qJin').value=Math.floor(n);$('qLiang').value=Math.round((n-Math.floor(n))*16)||'';kpTarget($('qJin'))}else{$('qN').value=n;kpTarget($('qN'))}}

/* ---------- 畫面上的數字鍵盤：平板不用跳出系統鍵盤 ---------- */
let KF=null,KFresh=false;// 目前要打進哪個框；剛點到的框，第一個數字會取代原本的值
const keypad=()=>`<div class="keypad">${['7','8','9','⌫','4','5','6','C','1','2','3','00','0','.'].map(k=>`<button type="button" data-k="${k}"${k==='0'?' class="z"':''}>${k==='C'?'清除':k}</button>`).join('')}</div>`;
function kpTarget(el){document.querySelectorAll('.kpon').forEach(x=>x.classList.remove('kpon'));KF=el||null;KFresh=true;el?.classList.add('kpon')}
function kpPress(k){
  if(!KF)return;let v=KF.value;
  if(k==='C')v='';else if(k==='⌫')v=KFresh?'':v.slice(0,-1);
  else{if(KFresh)v='';if(k==='.'&&(v.includes('.')||KF.dataset.int))return;v=v==='0'&&k!=='.'?k.replace(/^0+/,'')||'0':v+k}
  if(KF.dataset.max&&+v>+KF.dataset.max)return;
  KFresh=false;KF.value=v;KF.dispatchEvent(new Event('input',{bubbles:true}));
}
// 跳出數字鍵盤問一個數字（折扣、零用金、實點現金、進貨數量…），取消回傳 null
let numDone=null;
function askNum(title,cur='',{sub='',unit='',int=false}={}){
  $('numT').textContent=title;$('numSub').textContent=sub;$('numU').textContent=unit;
  $('numIn').value=cur??'';$('numIn').dataset.int=int?'1':'';if(!int)delete $('numIn').dataset.int;
  $('numKp').innerHTML=keypad();$('numM').classList.add('on');kpTarget($('numIn'));
  return new Promise(ok=>numDone=v=>{$('numM').classList.remove('on');kpTarget(null);ok(v)});
}
function saveQty(){
  const {p,l,u}=editing,q=readQty(),price=Math.max(0,+$('qtyPrice').value||0);
  // 論顆、散賣沒有預設單價，一定要打
  if(q>0&&!price&&(u==='散賣'||!(u===p.unit||JIN[u]&&JIN[p.unit]))){toast(u==='散賣'?'請打金額':'請打單價');kpTarget($('qtyPrice'));return}
  if(u!==p.unit&&!JIN[u])LP[p.id+u]=price;
  if(!(q>0)){if(l)cart.splice(cart.indexOf(l),1)}else if(l){l.qty=q;l.price=price;l.unit=u}else cart.push({pid:p.id,name:p.name,unit:u,qty:q,price});
  $('qtyM').classList.remove('on');editing=null;renderCart();
}

/* ---------- 結帳（不接線上金流，付款方式只是記錄） ---------- */
function openPay(){
  method='現金';$('payTotal').textContent=money(total());$('paid').value='';
  // 只有一種付款方式就不顯示
  $('methods').hidden=D.pay.length<2;
  $('methods').innerHTML=D.pay.map(m=>`<button data-m="${esc(m)}" aria-pressed="${m===method}">${esc(m)}</button>`).join('');
  const t=total(),q=[...new Set([t,Math.ceil(t/100)*100,Math.ceil(t/500)*500,Math.ceil(t/1000)*1000])].filter(n=>n>=t).slice(0,4);
  $('cashQuick').innerHTML=q.map(n=>`<button data-cash="${n}">${n===t?'剛好 ':''}${money(n)}</button>`).join('');
  renderChange();$('cashBox').hidden=false;$('noteBox').hidden=true;$('payNote').value='';$('payKp').innerHTML=keypad();$('payM').classList.add('on');kpTarget($('paid'));
}
function renderChange(){const t=total(),p=+$('paid').value||0;$('change').className='chg'+(p&&p<t?' neg':'');$('change').textContent=!p?'':p<t?`還差 ${money(t-p)}`:`找零 ${money(p-t)}`}
async function doPay(){
  const t=total(),paid=method==='現金'?(+$('paid').value||t):t;
  if(method==='現金'&&paid<t){toast('收的錢不夠');return}
  $('payOk').disabled=true;
  try{
    const j=await api('POST',{action:'posCheckout',items:cart.map(l=>({pid:l.pid,unit:l.unit,qty:l.qty,price:l.price})),discount:disc(),method,paid,payNote:$('payNote').value.trim(),customerId:cust?.id||''});
    const s=j.sale;$('payM').classList.remove('on');
    toast(`已結帳 ${money(s.total)}${s.change?`，找零 ${money(s.change)}`:''}`);
    resetSale();if($('autoPrint').checked)printReceipt(s);
    refresh();
  }catch(e){toast(e.message)}finally{$('payOk').disabled=false}
}
async function refresh(){try{const j=await api('GET',null,'?pos=');Object.assign(D,j);renderAll()}catch{}}

/* ---------- 收據、日結單 ---------- */
function printHtml(h){$('receipt').innerHTML=h;setTimeout(()=>window.print(),50)}
function printReceipt(s){
  const t=new Date(s.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
  printHtml(`<h2>${esc(D.shop.name)}</h2><div class="c">收據 ${esc(s.no)}<br>${esc(t)}${s.customer?`<br>常客：${esc(s.customer.name)}`:''}</div><div class="hr"></div>
  <table>${s.items.map(i=>`<tr><td>${esc(i.name)}<br>${esc(lineText(i))}</td><td class="n">${money(i.amount)}</td></tr>`).join('')}</table><div class="hr"></div>
  <table>${s.discount?`<tr><td>小計</td><td class="n">${money(s.subtotal)}</td></tr><tr><td>折扣</td><td class="n">-${money(s.discount)}</td></tr>`:''}
  <tr class="tot"><td>合計</td><td class="n">${money(s.total)}</td></tr><tr><td>${esc(s.method)}${s.payNote?` ${esc(s.payNote)}`:''}</td><td class="n">${money(s.paid)}</td></tr>${s.change?`<tr><td>找零</td><td class="n">${money(s.change)}</td></tr>`:''}</table>
  <div class="hr"></div><div class="c">謝謝光臨${D.shop.phone?`<br>${esc(D.shop.phone)}`:''}</div>${s.void?'<h2>＊已作廢＊</h2>':''}`);
}
function printDay(d,sum,expected){
  const c=d.close;
  printHtml(`<h2>${esc(D.shop.name)}</h2><div class="c">日結單 ${esc(D.today)}</div><div class="hr"></div><table>
  <tr><td>交易筆數</td><td class="n">${sum.count}</td></tr><tr class="tot"><td>營收合計</td><td class="n">${money(sum.total)}</td></tr>
  ${Object.entries(sum.by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${money(v)}</td></tr>`).join('')}${sum.voided?`<tr><td>作廢</td><td class="n">${sum.voided} 筆</td></tr>`:''}</table><div class="hr"></div><table>
  <tr><td>零用金</td><td class="n">${money(d.open?.cash||0)}</td></tr>${d.moves.map(m=>`<tr><td>${m.type==='in'?'存入':'提出'} ${esc(m.note)}</td><td class="n">${m.type==='in'?'':'-'}${money(m.amount)}</td></tr>`).join('')}
  <tr class="tot"><td>應有現金</td><td class="n">${money(expected)}</td></tr>${c?`<tr><td>實點現金</td><td class="n">${money(c.counted)}</td></tr><tr class="tot"><td>差額</td><td class="n">${c.diff>0?'+':''}${money(c.diff)}</td></tr>`:''}</table>
  ${c?`<div class="hr"></div><div>日結：${esc(c.by)} ${tm(c.at)}${c.note?`<br>${esc(c.note)}`:''}</div>`:''}`);
}

/* ---------- 其他分頁 ---------- */
function renderPane(){({holds:paneHolds,hist:paneHist,cash:paneCash,stock:paneStock,cust:paneCust})[view]()}
const P=h=>$('paneV').innerHTML=h;

// 掛單
function paneHolds(){
  P(`<h2>掛單</h2><p style="color:var(--muted)">收銀時按「掛單」先存起來，換下一位結帳；回來按「取回」接著結。</p><div class="card list">${D.holds.length?D.holds.map(h=>{const t=h.items.reduce((a,i)=>a+i.amount,0)-(h.discount||0);return `<div class="it"><div><b>${esc(h.name||'（沒寫名字）')}</b>${h.customer?`　常客 ${esc(h.customer.name)}`:''}<small>${tm(h.at)}・${esc(h.by)}・${h.items.map(i=>`${esc(i.name)} ${esc(qtyText(i.qty,i.unit))}`).join('、')}</small></div><div class="b"><b>${money(t)}</b><button class="btn sm go" data-unhold="${h.id}">取回</button><button class="btn sm red" data-delhold="${h.id}">刪除</button></div></div>`}).join(''):'<p style="color:var(--muted)">目前沒有掛單</p>'}</div>`);

// 交易紀錄
async function paneHist(load){
  if(!H||load){P('<p>載入中…</p>');try{H=await api('GET',null,'?posday='+(H?.date||D.today))}catch(e){P(`<p>${esc(e.message)}</p>`);return}}
  const q=histQ.trim(),L=H.sales.filter(x=>!q||x.no.includes(q)||x.items.some(i=>i.name.includes(q))||(x.customer?.name||'').includes(q)),s=H.summary;
  P(`<h2>交易紀錄</h2><div class="form card"><input type="date" id="hDate" value="${H.date}"><input type="search" id="hQ" placeholder="收據號、品名、常客" value="${esc(histQ)}"><button class="btn" id="hCsv">匯出 Excel</button></div>
  <div class="card"><b>${s.count} 筆，共 ${money(s.total)}</b>　${Object.entries(s.by).map(([k,v])=>`${esc(k)} ${money(v)}`).join('・')}${s.voided?`　（作廢 ${s.voided} 筆）`:''}</div>
  <div class="card list">${L.length?L.map(x=>`<div class="it ${x.void?'void':''}"><div><b>${esc(x.no)}　${tm(x.at)}</b>${x.customer?`　常客 ${esc(x.customer.name)}`:''}<small>${x.items.map(i=>`${esc(i.name)} ${esc(qtyText(i.qty,i.unit))}`).join('、')}・${esc(x.by)}${x.void?`<br>已作廢：${esc(x.void.reason||'')}（${esc(x.void.by)}）`:''}</small></div>
    <div class="b"><b>${money(x.total)} ${esc(x.method)}</b>${x.payNote?`<small>${esc(x.payNote)}</small>`:''}<button class="btn sm" data-reprint="${x.id}">補印</button>${!x.void&&H.date===D.today?`<button class="btn sm red" data-void="${x.id}">作廢</button>`:''}</div></div>`).join(''):'<p style="color:var(--muted)">沒有交易</p>'}</div>`);
}
function histCsv(){
  const rows=[['收據號','時間','品項','數量','單位','單價','金額','小計','折扣','合計','付款方式','常客','收銀','作廢']];
  for(const x of H.sales.slice().reverse())x.items.forEach((i,k)=>rows.push([x.no,new Date(x.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}),i.name,i.qty,i.unit,i.price,i.amount,k?'':x.subtotal,k?'':x.discount,k?'':x.total,x.method,x.customer?.name||'',x.by,x.void?'作廢':'']));
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`門市交易_${H.date}.csv`;a.click();
}
// 錢櫃日結
function paneCash(){
  const d=D.day,s=D.summary;
  if(!d.open){P(`<h2>錢櫃日結</h2><div class="card"><p>今天還沒開班。先點一下錢櫃裡的零用金（找零用的錢）。</p><div class="form"><input id="openCash" class="kp" inputmode="none" readonly data-ask="零用金（錢櫃裡找零用的錢）" data-int="1" placeholder="零用金，點這裡輸入"><button class="btn go" id="openGo">開班</button></div></div>`);return}
  const c=d.close;
  P(`<h2>錢櫃日結</h2>
  <div class="card"><div class="kv"><span>開班</span><span>${tm(d.open.at)}・${esc(d.open.by)}</span></div><div class="kv"><span>零用金</span><b>${money(d.open.cash)}</b></div>
  ${d.moves.map(m=>`<div class="kv"><span>${m.type==='in'?'存入':'提出'}：${esc(m.note)}　<small style="color:var(--muted)">${tm(m.at)}・${esc(m.by)}</small></span><b>${m.type==='in'?'+':'-'}${money(m.amount)}</b></div>`).join('')}
  ${c?'':`<div class="form" style="margin-top:10px"><select id="mvType"><option value="out">提出（拿錢出去）</option><option value="in">存入（放錢進來）</option></select><input id="mvAmt" class="kp" inputmode="none" readonly data-ask="金額" data-int="1" placeholder="金額"><input id="mvNote" maxlength="40" placeholder="用途，例如 買塑膠袋"><button class="btn" id="mvGo">記一筆</button></div>`}</div>
  <div class="card"><div class="kv"><span>今日交易</span><b>${s.count} 筆　${money(s.total)}</b></div>${Object.entries(s.by).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${money(v)}</span></div>`).join('')}${s.voided?`<div class="kv"><span>作廢</span><span>${s.voided} 筆</span></div>`:''}
  <div class="kv"><span>應有現金（零用金＋現金收入＋存入－提出）</span><b>${money(D.expected)}</b></div></div>
  ${c?`<div class="card"><div class="kv"><span>實點現金</span><b>${money(c.counted)}</b></div><div class="kv"><span>差額</span><span class="diff ${c.diff<0?'neg':c.diff>0?'pos':'ok'}">${c.diff===0?'剛好 ✓':(c.diff>0?'多 ':'少 ')+money(Math.abs(c.diff))}</span></div>${c.note?`<div class="kv"><span>備註</span><span>${esc(c.note)}</span></div>`:''}<div class="kv"><span>日結</span><span>${tm(c.at)}・${esc(c.by)}</span></div>
    <div class="form" style="margin-top:10px"><button class="btn go" id="dayPrint">印日結單</button><button class="btn" id="reopen">重新開帳</button></div></div>`
  :`<div class="card"><p><b>日結</b>：把錢櫃裡的現金點一點，填進來。</p><div class="form"><input id="counted" class="kp" inputmode="none" readonly data-ask="實點現金（錢櫃裡全部的現金）" data-int="1" placeholder="實點現金，點這裡輸入"><input id="closeNote" maxlength="60" placeholder="備註（選填）"><span id="diffPrev" class="diff"></span></div><div class="form" style="margin-top:10px"><button class="btn go" id="closeGo">完成日結</button><button class="btn" id="dayPrint">先印對帳</button></div></div>`}`);
}
// 庫存
async function paneStock(){
  const rows=D.products.map(p=>{const st=stockOf(p.id),low=D.stock.low[p.id];return `<tr><td>${esc(p.name)}<br><small style="color:var(--muted)">${esc(p.cat||'')}</small></td>
    <td class="n ${isLow(p.id)?'low':''}">${st==null?'<small style="color:var(--muted)">沒有管</small>':esc(qtyText(st,p.unit))}</td>
    <td class="n">${st==null?'':`<input class="kp" inputmode="none" readonly data-ask="低於多少提醒（${esc(p.unit)}）" data-low="${p.id}" value="${low??''}" placeholder="不提醒">`}</td>
    <td class="n">${st==null?`<button class="btn sm" data-track="${p.id}">開始管</button>`:`<button class="btn sm go" data-stin="${p.id}">＋進貨</button> <button class="btn sm" data-stadj="${p.id}">盤點</button> <button class="btn sm red" data-untrack="${p.id}">停止</button>`}</td></tr>`}).join('');
  const lowN=D.products.filter(p=>isLow(p.id)).length;
  P(`<h2>庫存</h2>${lowN?`<div class="warnbar">有 ${lowN} 樣快沒貨了</div>`:''}<p style="color:var(--muted)">按「開始管」才會記這個品項的庫存。門市賣出自動扣、作廢加回；進貨按「＋進貨」，盤點直接改成實際數量。批發出貨不會扣。</p>
  <div class="card" style="overflow-x:auto"><table class="stk"><thead><tr><th>品項</th><th class="n">庫存</th><th class="n">低於提醒</th><th class="n"></th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2>最近異動</h2><div class="card list" id="moves"><p>載入中…</p></div>`);
  try{const j=await api('GET',null,'?stockmoves=1');$('moves').innerHTML=j.moves.length?j.moves.map(m=>`<div class="it"><div><b>${esc(m.name)}</b>　${m.type==='in'?'進貨':'盤點'}<small>${new Date(m.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}・${esc(m.by)}${m.note?'・'+esc(m.note):''}</small></div><div class="b"><b>${m.delta>0?'+':''}${esc(qtyText(m.delta,m.unit))}</b><small>→ ${esc(qtyText(m.after,m.unit))}</small></div></div>`).join(''):'<p style="color:var(--muted)">還沒有紀錄</p>'}catch{}
}
async function stockApi(body,msg){try{const j=await api('POST',{action:'posStock',...body});D.stock=j.stock;renderGrid();paneStock();toast(msg)}catch(e){toast(e.message)}}
// 常客
function paneCust(){
  P(`<h2>常客／會員</h2><div class="form card"><input type="search" id="cq" placeholder="打名字或電話"><button class="btn go" id="custAdd">＋ 新增常客</button></div><div class="card list" id="cl"></div>`);
  renderCustList();
}
function custRows(q,pick){
  const L=D.customers.filter(c=>!q||c.name.includes(q)||(c.phone||'').includes(q));
  return L.length?L.map(c=>`<div class="it"><div><b>${esc(c.name)}</b>${c.discount?`　${c.discount} 折`:''}<small>${esc(c.phone||'')}${c.note?'・'+esc(c.note):''}・來 ${c.visits||0} 次・共 ${money(c.total||0)}${c.lastAt?'・最近 '+new Date(c.lastAt).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'}):''}</small></div><div class="b">${pick?`<button class="btn sm go" data-pickc="${c.id}">選這位</button>`:`<button class="btn sm" data-editc="${c.id}">編輯</button><button class="btn sm red" data-delc="${c.id}">刪除</button>`}</div></div>`).join(''):'<p style="color:var(--muted)">找不到，可以按「新增常客」</p>';
}
function renderCustList(){$('cl').innerHTML=custRows(($('cq')?.value||'').trim(),false)}
function openCed(c){editCust=c||null;$('cName').value=c?.name||'';$('cPhone').value=c?.phone||'';$('cDisc').value=c?.discount||'';$('cNote').value=c?.note||'';$('cedM').classList.add('on');setTimeout(()=>$('cName').focus(),50)}
async function saveCed(){
  try{const j=await api('POST',{action:'posCustomer',id:editCust?.id||'',name:$('cName').value,phone:$('cPhone').value,discount:$('cDisc').value,note:$('cNote').value});
    D.customers=j.customers;$('cedM').classList.remove('on');toast('已儲存');
    if($('custM').classList.contains('on')){const c=D.customers.find(x=>x.name===$('cName').value.trim());if(c&&!editCust){cust=c;discManual=false;$('custM').classList.remove('on');renderCart()}else $('custList').innerHTML=custRows($('custQ').value.trim(),true)}
    if(view==='cust')renderCustList();
  }catch(e){toast(e.message)}
}

/* ---------- 事件 ---------- */
document.addEventListener('click',async e=>{
  const inp=e.target.closest('input.kp');
  if(inp){if(inp.dataset.ask){const v=await askNum(inp.dataset.ask,inp.value,{int:!!inp.dataset.int});if(v!==null){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}))}}else kpTarget(inp);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){kpPress(b.dataset.k);return}
  if(b.id==='numOk'){numDone?.($('numIn').value);return}
  if(b.id==='numCancel'){numDone?.(null);return}
  if(b.dataset.v){showView(b.dataset.v);return}
  if(b.dataset.cat){cat=b.dataset.cat;renderCats();renderGrid()}
  if(b.dataset.p)addProduct(PM()[b.dataset.p]);
  if(b.dataset.ed){const l=cart[+b.dataset.ed];openQty(PM()[l.pid]||{id:l.pid,name:l.name,unit:l.unit,price:l.price},l)}
  if(b.dataset.rm){cart.splice(+b.dataset.rm,1);renderCart()}
  if(b.dataset.qm){setMode(b.dataset.qm);return}
  if(b.dataset.qq)setQtyInputs(+b.dataset.qq);
  if(b.id==='qtyOk')saveQty();
  if(b.id==='qtyCancel'){$('qtyM').classList.remove('on');editing=null}
  if(b.id==='payBtn')openPay();
  if(b.id==='payCancel')$('payM').classList.remove('on');
  if(b.id==='payOk')doPay();
  if(b.dataset.m){method=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('cashBox').hidden=method!=='現金';$('noteBox').hidden=method==='現金';if(method==='現金')kpTarget($('paid'))}
  if(b.dataset.cash){$('paid').value=b.dataset.cash;renderChange()}
  if(b.id==='clearBtn'&&cart.length&&confirm('清空這次的品項？'))resetSale();
  if(b.id==='adminBtn')location.href='/admin';
  // 常客
  if(b.id==='custPick'){$('custQ').value='';$('custList').innerHTML=custRows('',true);$('custM').classList.add('on');setTimeout(()=>$('custQ').focus(),50)}
  if(b.id==='custOff'){cust=null;discManual=false;renderCart()}
  if(b.dataset.pickc){cust=CM()[b.dataset.pickc];discManual=false;$('custM').classList.remove('on');renderCart()}
  if(b.id==='custClose')$('custM').classList.remove('on');
  if(b.id==='custNew'||b.id==='custAdd')openCed(null);
  if(b.dataset.editc)openCed(CM()[b.dataset.editc]);
  if(b.dataset.delc){const c=CM()[b.dataset.delc];if(confirm(`刪除常客「${c.name}」？以前的交易紀錄會留著`)){try{const j=await api('POST',{action:'posCustomerDel',id:c.id});D.customers=j.customers;renderCustList()}catch(err){toast(err.message)}}}
  if(b.id==='cedOk')saveCed();
  if(b.id==='cedCancel')$('cedM').classList.remove('on');
  // 掛單
  if(b.id==='holdBtn'){
    if(!cart.length){toast('還沒有品項可以掛單');return}
    const name=prompt('這筆掛單叫什麼？（客人名字或特徵，可以空白）',cust?.name||'');if(name===null)return;
    try{const j=await api('POST',{action:'posHold',name,items:cart.map(l=>({pid:l.pid,unit:l.unit,qty:l.qty,price:l.price})),discount:discManual?disc():0,customer:cust});D.holds=j.holds;resetSale();renderTop();toast('已掛單，可以結下一位')}catch(err){toast(err.message)}
  }
  if(b.dataset.unhold){
    const h=D.holds.find(x=>x.id===b.dataset.unhold);if(cart.length&&!confirm('收銀台上還有品項，取回會換掉，確定？'))return;
    cart=h.items.map(i=>({pid:i.pid,name:i.name,unit:i.unit,qty:i.qty,price:i.price}));cust=h.customer?CM()[h.customer.id]||null:null;discManual=!!h.discount;$('disc').value=h.discount||'';
    try{const j=await api('POST',{action:'posHoldDel',id:h.id});D.holds=j.holds}catch{}
    renderTop();showView('sell');renderCart();toast(`已取回${h.name?'「'+h.name+'」':''}`);
  }
  if(b.dataset.delhold&&confirm('刪除這筆掛單？')){try{const j=await api('POST',{action:'posHoldDel',id:b.dataset.delhold});D.holds=j.holds;renderTop();paneHolds()}catch(err){toast(err.message)}}
  // 交易紀錄
  if(b.dataset.reprint)printReceipt((H?.sales||D.sales).find(x=>x.id===b.dataset.reprint));
  if(b.dataset.void){
    const x=H.sales.find(s=>s.id===b.dataset.void);const reason=prompt(`作廢收據 ${x.no}（${money(x.total)}）？請寫原因`,'打錯');if(reason===null)return;
    try{await api('POST',{action:'posVoid',id:x.id,reason});toast('已作廢');await refresh();paneHist(true)}catch(err){toast(err.message)}
  }
  if(b.id==='hCsv')histCsv();
  // 錢櫃日結
  if(b.id==='openGo'){try{const j=await api('POST',{action:'posOpen',cash:+$('openCash').value||0});Object.assign(D,j);renderTop();paneCash();toast('已開班')}catch(err){toast(err.message)}}
  if(b.id==='mvGo'){try{const j=await api('POST',{action:'posCash',type:$('mvType').value,amount:+$('mvAmt').value,note:$('mvNote').value});Object.assign(D,j);paneCash();toast('已記錄')}catch(err){toast(err.message)}}
  if(b.id==='closeGo'){
    const v=$('counted').value;if(v===''){toast('請填實點現金');return}
    if(!confirm(`實點現金 ${money(+v)}，應有 ${money(D.expected)}，確定日結？`))return;
    try{const j=await api('POST',{action:'posClose',counted:+v,note:$('closeNote').value});Object.assign(D,j);paneCash();toast('日結完成')}catch(err){toast(err.message)}
  }
  if(b.id==='reopen'&&confirm('重新開帳？日結的結果會清掉，之後要再日結一次')){try{const j=await api('POST',{action:'posReopen'});Object.assign(D,j);paneCash()}catch(err){toast(err.message)}}
  if(b.id==='dayPrint')printDay(D.day,D.summary,D.expected);
  // 庫存
  if(b.dataset.track){const p=PM()[b.dataset.track],q=await askNum(`「${p.name}」現在有多少？`,'',{unit:p.unit});if(q===null)return;stockApi({pid:p.id,type:'track',qty:+q||0},'開始管庫存')}
  if(b.dataset.stin){const p=PM()[b.dataset.stin],q=await askNum(`「${p.name}」進貨多少？`,'',{unit:p.unit});if(!q)return;const note=prompt('備註（供應商等，可以空白）','')||'';stockApi({pid:p.id,type:'in',qty:+q,note},'已加進庫存')}
  if(b.dataset.stadj){const p=PM()[b.dataset.stadj],q=await askNum(`「${p.name}」實際盤點有多少？`,'',{unit:p.unit,sub:`目前記的是 ${qtyText(stockOf(p.id),p.unit)}`});if(q===null||q==='')return;stockApi({pid:p.id,type:'adjust',qty:+q,note:'盤點'},'已更新庫存')}
  if(b.dataset.untrack){const p=PM()[b.dataset.untrack];if(confirm(`停止管「${p.name}」的庫存？`))stockApi({pid:p.id,type:'untrack'},'已停止')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='hDate'){H.date=t.value;paneHist(true)}

});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.low)stockApi({pid:t.dataset.low,type:'low',qty:+t.value||0},'已設定提醒');
  if(t.id==='hQ'){histQ=t.value;paneHist()}
  if(t.id==='cq')renderCustList();
  if(t.id==='custQ')$('custList').innerHTML=custRows(t.value.trim(),true);
  if(t.id==='counted'){const d=(+t.value||0)-D.expected;$('diffPrev').className='diff '+(d<0?'neg':d>0?'pos':'ok');$('diffPrev').textContent=t.value===''?'':d===0?'剛好 ✓':(d>0?'多 ':'少 ')+money(Math.abs(d))}
});
$('q').addEventListener('input',renderGrid);
$('disc').addEventListener('input',()=>{discManual=true;renderCart()});
$('paid').addEventListener('input',renderChange);
$('autoPrint').addEventListener('change',e=>{try{localStorage.setItem('posPrint',e.target.checked?'1':'0')}catch{}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('numM').classList.contains('on')){e.preventDefault();numDone?.($('numIn').value);return}if(e.key==='Enter'&&$('qtyM').classList.contains('on')){e.preventDefault();saveQty()}if(e.key==='Escape')document.querySelectorAll('.modal.on').forEach(m=>m.classList.remove('on'))});
// 有新版本：切回收銀頁、收銀台上沒有品項時自動更新（版本號跟後台同一個）
let MY_VER=null;
const verOf=async()=>{try{return (await (await fetch('/admin?v='+Date.now(),{cache:'no-store'})).text()).match(/<small class="ver">([^<]+)</)?.[1]}catch{}};
verOf().then(v=>MY_VER=v);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||cart.length||document.querySelector('.modal.on'))return;const v=await verOf();if(v&&MY_VER&&v!==MY_VER)location.reload()});
initAuth();
