<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>叫貨單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EA; --surface:#FFFFFF; --ink:#1B2A21; --muted:#5B6B60; --line:#D6E0D0;
  --leaf:#2F6B45; --leaf-soft:#DCEBDD; --tag:#F5D547; --alert:#B23A2E; --line-green:#06C755;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111915; --surface:#1A241E; --ink:#E4ECE5; --muted:#98A99E; --line:#2B3A31;
    --leaf:#78C093; --leaf-soft:#22362A; --alert:#E0776B;
  }
}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1A241E; --ink:#E4ECE5; --muted:#98A99E; --line:#2B3A31;
  --leaf:#78C093; --leaf-soft:#22362A; --alert:#E0776B;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.head{background:var(--line-green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.head b{font-size:1.15rem;display:block}
.head small{display:block;opacity:.95;font-size:.85rem}
.tools{padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tools input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:7px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 12px;font-size:.88rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips .ct{display:inline-block;margin-left:4px;background:var(--tag);color:#2A2400;border-radius:8px;padding:0 5px;font-size:.75rem;font-weight:700}
.list{flex:1;overflow-y:auto}
.repeat{margin:10px 12px;padding:10px 12px;border:1px dashed var(--leaf);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.repeat button{border:0;background:var(--leaf);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700;white-space:nowrap}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.prow.sel{background:var(--leaf-soft)}
.prow .pn{font-weight:700;font-size:1.05rem}
.prow .pn small{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:6px}
.prow .pn em{font-style:normal;font-weight:400;color:var(--alert);font-size:.78rem;margin-left:6px}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:700;line-height:1;display:grid;place-items:center}
.stp button.plus{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stp input{width:56px;height:40px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-weight:900;font-size:1.1rem;padding:0}
.prow.sel .stp input{border-color:var(--leaf);background:var(--surface)}
.stp input::-webkit-inner-spin-button{display:none}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .u{color:var(--muted);font-size:.9rem}
.ctl select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 4px;font-weight:700;font-size:1rem}
.prow.jin .stp input{width:48px}
.noitem,.msg{padding:28px 16px;color:var(--muted);text-align:center}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.bar span{flex:1;font-size:.92rem}
.bar button{border:0;background:var(--line-green);color:#fff;border-radius:22px;padding:11px 20px;font-weight:700}
.bar button:disabled{background:var(--line);color:var(--muted)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet-in{background:var(--surface);width:100%;max-height:85%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in h3{margin:0;padding:14px 16px 6px;font-size:1.05rem}
.sl{overflow-y:auto;padding:0 16px}
.sl div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.sl .chg{color:var(--leaf);font-size:.8rem;margin-left:6px}
.err{color:var(--alert);font-weight:700;font-size:.9rem;padding:4px 16px 0}
.sa{display:flex;gap:8px;padding:12px 16px}
.sa button{flex:1;border-radius:22px;padding:11px;font-weight:700;border:1px solid var(--line);background:var(--bg)}
.sa .go{background:var(--line-green);border-color:var(--line-green);color:#fff}
.done{position:absolute;inset:0;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;z-index:6}
.done.on{display:flex}
.done .ok{font-size:2.8rem;line-height:1}
.done p{margin:0;color:var(--muted);font-size:.92rem}
.done ul{list-style:none;margin:6px 0;padding:0;width:100%;max-width:320px;text-align:left}
.done li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.done button{border:1px solid var(--leaf);background:transparent;color:var(--leaf);border-radius:20px;padding:8px 16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;z-index:30}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="head"><b id="title">叫貨單</b><small id="subtitle">載入中…</small></div>
  <div class="msg" id="msg" hidden></div>
  <div class="tools" id="tools" hidden>
    <input id="q" type="search" placeholder="找品項，例如：蒜仁" aria-label="搜尋品項">
    <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="plist" hidden></div>
  <div class="bar" id="bar" hidden><span id="cartInfo"></span><button id="review" disabled>送出訂單</button></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in"><h3 id="sheetTitle">確認這次叫的貨</h3><div class="sl" id="sheetList"></div><div class="err" id="err" role="alert"></div><div class="sa"><button id="back">返回修改</button><button class="go" id="submit">確認送出</button></div></div></div>
  <div class="done" id="done" role="status"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtQ=q=>Number.isInteger(q)?q:(+q.toFixed(2));
// 和 lib/qty.js 的 qtyText 一樣：斤用「幾斤幾兩」（1 斤 = 16 兩）
function qtyText(q,unit){q=Number(q)||0;if(unit==='斤'&&!Number.isInteger(q)){let j=Math.floor(q),l=Math.round((q-j)*16);if(l===16){j++;l=0}if(Math.abs(j+l/16-q)<0.001)return `${j?j+'斤':''}${l?l+'兩':''}`||'0斤'}return `${Number.isInteger(q)?q:+q.toFixed(2)} ${unit}`}
const jinOf=q=>Math.floor(q+1e-9),liangOf=q=>Math.round((q-jinOf(q))*16)%16;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
const T=new URLSearchParams(location.search).get('t')||'';
let D=null,cart={},cat='常叫',liffReady=false;
const PM=()=>Object.fromEntries(D.products.map(p=>[p.id,p]));

async function load(){
  let r;
  try{r=await fetch('/api/shop?t='+encodeURIComponent(T));D=await r.json()}catch{D={error:'載入失敗，請重新整理'}}
  if(D.shopName){$('title').textContent=D.shopName}
  if(!r?.ok){$('subtitle').textContent='';$('msg').hidden=false;$('msg').textContent=D.error;return}
  document.title=D.store.name+' 叫貨單';
  $('title').textContent=D.store.name+'・叫貨單';
  $('subtitle').textContent=`${D.dateLabel} 配送，${D.cutoff} 前可以改`;
  ['tools','plist','bar'].forEach(id=>$(id).hidden=false);
  cart={};(D.order?.items||[]).forEach(i=>cart[i.pid]=i.qty);
  // 訂單裡有、但已經下架的品項，也要顯示出來
  (D.order?.items||[]).forEach(i=>{if(!PM()[i.pid])D.products.push({id:i.pid,name:i.name,unit:i.unit,cat:'',on:false})});
  cat=frequent().size?'常叫':'全部';
  // 從 LINE「用叫貨單修改」進來：把 AI 整理的品項加進去
  if(D.draft){D.draft.items.forEach(i=>{cart[i.pid]=Math.round(((cart[i.pid]||0)+i.qty)*10000)/10000});cat='全部'}
  render();
  if(D.draft)toast(D.draft.unknown.length?`已帶入 AI 整理的品項。看不懂的：${D.draft.unknown.join('、')}`:'已帶入 AI 整理的品項，確認後按送出');
  if(D.liffId)initLiff();
}
function initLiff(){
  const s=document.createElement('script');s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.onload=()=>liff.init({liffId:D.liffId}).then(()=>{liffReady=liff.isInClient()}).catch(()=>{});
  document.head.appendChild(s);
}
const frequent=()=>new Set([...(D.last?.items||[]).map(i=>i.pid),...(D.order?.items||[]).map(i=>i.pid)]);
const had=()=>!!D.order;

function render(){renderChips();renderList();renderBar()}
function renderChips(){
  const cnt={};const pm=PM();Object.keys(cart).forEach(pid=>{if(cart[pid]>0&&pm[pid]){const c=pm[pid].cat;cnt[c]=(cnt[c]||0)+1}});
  const list=['常叫','全部',...D.categories];
  $('chips').innerHTML=list.map(c=>`<button data-cat="${c}" aria-pressed="${c===cat}">${c==='常叫'?'我常叫的':c}${cnt[c]?`<span class="ct">${cnt[c]}</span>`:''}</button>`).join('');
}
function visible(){
  const q=$('q').value.trim();
  const items=D.products.filter(p=>p.on||cart[p.id]>0);
  if(q)return items.filter(p=>p.name.includes(q));
  if(cat==='常叫'){const f=frequent();Object.keys(cart).forEach(k=>cart[k]>0&&f.add(k));return items.filter(p=>f.has(p.id))}
  if(cat==='全部')return items;
  return items.filter(p=>p.cat===cat);
}
function rowHTML(p){
  const q=cart[p.id]||0,jin=p.unit==='斤';
  const stp=`<div class="stp"><button data-dq="-1" data-pid="${p.id}" aria-label="${esc(p.name)}減 1${esc(p.unit)}">−</button>
  ${jin?`<input type="number" inputmode="numeric" min="0" step="1" value="${jinOf(q)||''}" placeholder="0" data-jin="${p.id}" aria-label="${esc(p.name)}幾斤">`
    :`<input type="number" inputmode="decimal" min="0" step="any" value="${q?fmtQ(q):''}" placeholder="0" data-qin="${p.id}" aria-label="${esc(p.name)}數量（${esc(p.unit)}）">`}
  <button class="plus" data-dq="1" data-pid="${p.id}" aria-label="${esc(p.name)}加 1${esc(p.unit)}" ${p.on?'':'disabled'}>+</button></div>`;
  const ctl=jin?`<div class="ctl">${stp}<span class="u">斤</span><select data-liang="${p.id}" aria-label="${esc(p.name)}幾兩">${Array.from({length:16},(_,i)=>`<option value="${i}" ${i===liangOf(q)?'selected':''}>${i}</option>`).join('')}</select><span class="u">兩</span></div>`:stp;
  return `<div class="prow ${q>0?'sel':''} ${jin?'jin':''}" id="r-${p.id}"><div class="pn">${esc(p.name)}${jin?'':`<small>${esc(p.unit)}</small>`}${p.on?'':'<em>暫停供貨</em>'}</div>${ctl}</div>`;
}
function renderList(){
  const items=visible(),q=$('q').value.trim();
  let h='';
  if(cat==='常叫'&&!q&&D.last&&!Object.values(cart).some(v=>v>0))
    h+=`<div class="repeat"><span>上次叫了 ${D.last.items.length} 樣</span><button data-repeat="1">照上次叫</button></div>`;
  h+=items.length?items.map(rowHTML).join(''):`<div class="noitem">${q?'找不到這個品項，可以在 LINE 留言告訴老闆':'還沒有常叫的品項，點「全部」或分類開始選'}</div>`;
  $('plist').innerHTML=h;
}
function renderBar(){
  const n=Object.values(cart).filter(v=>v>0).length;
  $('cartInfo').textContent=n?`已選 ${n} 樣`:(had()?'全部清空會取消這次的訂單':'還沒選任何品項');
  $('review').disabled=!n&&!had();
  $('review').textContent=had()?'更新訂單':'送出訂單';
}
function setQty(pid,q){
  q=Math.max(0,Math.min(999,Math.round(q*10000)/10000));
  if(q>0)cart[pid]=q;else delete cart[pid];
  const r=$('r-'+pid);
  if(r){
    r.classList.toggle('sel',q>0);const inp=r.querySelector('input'),sel=r.querySelector('select');
    if(sel){if(document.activeElement!==inp)inp.value=jinOf(q)||'';sel.value=liangOf(q)}
    else if(document.activeElement!==inp)inp.value=q?fmtQ(q):'';
  }
  renderChips();renderBar();
}
function openSheet(){
  const pm=PM(),old=Object.fromEntries((D.order?.items||[]).map(i=>[i.pid,i.qty]));
  const ids=[...new Set([...Object.keys(cart).filter(k=>cart[k]>0),...Object.keys(old)])];
  ids.sort((a,b)=>D.products.indexOf(pm[a])-D.products.indexOf(pm[b]));
  $('sheetTitle').textContent=had()?'確認修改後的訂單':'確認這次叫的貨';
  $('sheetList').innerHTML=ids.map(pid=>{
    const p=pm[pid],n=cart[pid]||0,o=old[pid]||0;
    const chg=!had()||n===o?'':o===0?'新增':n===0?'取消':`原 ${qtyText(o,p.unit)}`;
    return `<div><span>${esc(p.name)}${chg?`<span class="chg">${chg}</span>`:''}</span><b>${n?esc(qtyText(n,p.unit)):'不要了'}</b></div>`;
  }).join('')||'<div><span>全部取消</span></div>';
  $('err').textContent='';$('sheet').classList.add('on');$('submit').focus();
}
async function submit(){
  const btn=$('submit');btn.disabled=true;btn.textContent='送出中…';
  try{
    const items=Object.entries(cart).filter(([,q])=>q>0).map(([pid,qty])=>({pid,qty}));
    const r=await fetch('/api/shop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,date:D.date,items,viaLiff:liffReady,draftId:D.draft?.id})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'送出失敗');
    const wasHad=had();
    D.order=j.order.items.length?j.order:null;D.draft=null;
    $('sheet').classList.remove('on');
    const word=!j.order.items.length?'取消今天的訂單':wasHad?'訂單已更新':'訂單已送出';
    if(liffReady){
      // 用店家的身分在聊天室說一句話，機器人會回訂單卡
      try{await liff.sendMessages([{type:'text',text:word}]);liff.closeWindow();return}catch{}
    }
    showDone(word,j.order);
  }catch(e){$('err').textContent=e.message}
  finally{btn.disabled=false;btn.textContent='確認送出'}
}
function showDone(word,o){
  $('done').innerHTML=`<div class="ok" aria-hidden="true">${o.items.length?'✅':'🗑️'}</div><h2 style="margin:0">${word==='取消今天的訂單'?'這次的訂單已取消':word}</h2>
    ${o.items.length?`<p>${D.dateLabel} 配送，${D.cutoff} 前都還可以改</p><ul>${o.items.map(i=>`<li><span>${esc(i.name)}</span><b>${esc(qtyText(i.qty,i.unit))}</b></li>`).join('')}</ul>`:''}
    <p>在 LINE 點「我的訂單」隨時可以查。</p><button id="again">繼續修改</button>`;
  $('done').classList.add('on');
  $('again').onclick=()=>{$('done').classList.remove('on');render()};
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cat){cat=b.dataset.cat;$('q').value='';renderChips();renderList();$('plist').scrollTop=0}
  if(b.dataset.dq){const pid=b.dataset.pid,q=cart[pid]||0,d=+b.dataset.dq;setQty(pid,d<0&&q<1?0:q+d)}
  if(b.dataset.repeat){const pm=PM();let skip=0;D.last.items.forEach(i=>{if(pm[i.pid]?.on)cart[i.pid]=i.qty;else skip++});render();toast(skip?`已帶入上次的品項，有 ${skip} 樣暫停供貨`:'已帶入上次的品項，可以再用 + − 調整')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.qin)setQty(t.dataset.qin,+t.value||0);
  if(t.dataset.jin){const l=+t.closest('.prow').querySelector('select').value;setQty(t.dataset.jin,Math.floor(+t.value||0)+l/16)}
});
document.addEventListener('focusin',e=>{if(e.target.dataset?.qin||e.target.dataset?.jin)e.target.select()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.dataset?.qin||e.target.dataset?.jin))e.target.blur()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.liang)setQty(t.dataset.liang,jinOf(cart[t.dataset.liang]||0)+(+t.value)/16)});
$('q').addEventListener('input',renderList);
$('review').addEventListener('click',openSheet);
$('back').addEventListener('click',()=>$('sheet').classList.remove('on'));
$('submit').addEventListener('click',submit);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').classList.remove('on')});
load();
</script>
</body>
</html>
